  function renderTasksView() {
    var data = computeTasksTabData();
    var html = '<div class="drawer-header"><button class="drawer-back" data-drawer-back aria-label="Back">‹</button><span>Tasks</span></div>';
    html += '<div class="drawer-body">';
    html += '<p class="td-section-label">Overdue (' + data.overdue.length + ")</p>";
    if (data.overdue.length === 0) html += '<p class="td-empty">Nothing overdue. 🎉</p>';
    data.overdue.forEach(function (t) { html += renderDrawerTaskRow(t, true); });

    html += '<p class="td-section-label" style="margin-top:16px;">Upcoming (' + data.upcoming.length + ")</p>";
    if (data.upcoming.length === 0) html += '<p class="td-empty">Nothing planned yet.</p>';
    data.upcoming.forEach(function (t) { html += renderDrawerTaskRow(t, false); });
    html += "</div>";
    return html;
  }

  function renderStatsView() {
    var weekDays = currentWeekDays();
    var keys = weekDays.map(formatDayKey);
    var allTasks = computeDisplayTasks();
    var weekTasks = allTasks.filter(function (t) { return keys.indexOf(t.dayKey) !== -1; });
    var total = weekTasks.length;
    var completed = weekTasks.filter(function (t) { return t.completed; }).length;
    var pct = total > 0 ? Math.round((completed / total) * 100) : 0;

    var html = '<div class="drawer-header"><button class="drawer-back" data-drawer-back aria-label="Back">‹</button><span>Stats</span></div>';
    html += '<div class="drawer-body">';
    html += '<p class="td-section-label">This week</p>';
    html += '<div class="stats-progress-row"><span class="stats-big">' + pct + '%</span><span class="stats-label">' + completed + " of " + total + " tasks completed</span></div>";
    html += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';

    html += '<p class="td-section-label" style="margin-top:16px;">Daily breakdown</p>';
    html += '<div class="daily-chart">';
    weekDays.forEach(function (d) {
      var dk = formatDayKey(d);
      var dayTasks = weekTasks.filter(function (t) { return t.dayKey === dk; });
      var dTotal = dayTasks.length;
      var dDone = dayTasks.filter(function (t) { return t.completed; }).length;
      var h = dTotal > 0 ? Math.max(6, Math.round((dDone / dTotal) * 48)) : 2;
      var dow = d.getDay() === 0 ? 6 : d.getDay() - 1;
      html += '<div class="daily-chart-col"><div class="daily-chart-bar-track"><div class="daily-chart-bar" style="height:' + h + 'px"></div></div><span>' + DAY_LABELS[dow][0] + "</span></div>";
    });
    html += "</div>";

    html += '<p class="td-section-label" style="margin-top:16px;">Lifetime</p>';
    html += '<div class="lifetime-stats-row"><div><div class="lifetime-num">' + lifetime.tasksCreated + '</div><div class="lifetime-label">Created</div></div>' +
      '<div><div class="lifetime-num">' + lifetime.completedIds.length + '</div><div class="lifetime-label">Completed</div></div></div>';
    html += "</div>";
    return html;
  }

  /* ============================== Confirm dialog ============================== */
  var confirmCancelFn = null;

  function showConfirm(opts) {
    confirmCancelFn = null;
    document.getElementById("confirmTitle").textContent = opts.title;
    var msgEl = document.getElementById("confirmMessage");
    if (opts.message) { msgEl.textContent = opts.message; msgEl.style.display = "block"; }
    else { msgEl.style.display = "none"; }
    var actionsEl = document.getElementById("confirmActions");
    actionsEl.innerHTML = "";
    opts.buttons.forEach(function (b) {
      if (b.isCancel) confirmCancelFn = b.onPress || null;
      var btn = document.createElement("button");
      btn.className = "confirm-btn " + (b.variant || "neutral");
      btn.textContent = b.label;
      btn.addEventListener("click", function () {
        closeConfirm();
        confirmCancelFn = null;
        if (b.onPress) b.onPress();
      });
      actionsEl.appendChild(btn);
    });
    document.getElementById("confirmModalBackdrop").classList.remove("hidden");
  }
  function closeConfirm() {
    document.getElementById("confirmModalBackdrop").classList.add("hidden");
  }
  function cancelConfirm() {
    var fn = confirmCancelFn;
    confirmCancelFn = null;
    closeConfirm();
    if (fn) fn();
  }

  function requestDeleteConfirm(id, onCancel, onDeleted) {
    var t = state.displayCache.find(function (x) { return x.id === id; });
    if (!t) return;
    if (t.recurrenceId) {
      showConfirm({
        title: "Delete recurring task",
        message: "This task repeats. Delete just this occurrence, or this and every future occurrence? Earlier ones are kept either way.",
        buttons: [
          { label: "Cancel", variant: "neutral", isCancel: true, onPress: onCancel },
          {
            label: "This task", variant: "neutral", onPress: function () {
              showConfirm({
                title: "Delete this task?",
                message: "This can't be undone.",
                buttons: [
                  { label: "Cancel", variant: "neutral", isCancel: true, onPress: onCancel },
                  { label: "Delete", variant: "danger", onPress: function () { deleteTask(id); if (onDeleted) onDeleted(); } },
                ],
              });
            }
          },
          {
            label: "This and future", variant: "danger", onPress: function () {
              showConfirm({
                title: "Delete this and future occurrences?",
                message: "Earlier occurrences are kept. This can't be undone.",
                buttons: [
                  { label: "Cancel", variant: "neutral", isCancel: true, onPress: onCancel },
                  { label: "Delete", variant: "danger", onPress: function () { deleteTaskSeriesFrom(t.recurrenceId, t.dayKey); if (onDeleted) onDeleted(); } },
                ],
              });
            }
          },
        ],
      });
    } else {
      showConfirm({
        title: "Delete task?",
        message: "This can't be undone.",
        buttons: [
          { label: "Cancel", variant: "neutral", isCancel: true, onPress: onCancel },
          { label: "Delete", variant: "danger", onPress: function () { deleteTask(id); if (onDeleted) onDeleted(); } },
        ],
      });
    }
  }

  // Deletes this occurrence and every future occurrence of the series,
  // but keeps the template and any earlier materialized instances intact.
  // Does this by capping the template's recurrenceUntil to the day before
  // fromDayKey, and removing any already-materialized instances on/after it.
  function deleteTaskSeriesFrom(recurrenceId, fromDayKey) {
    var dayBefore = formatDayKey(new Date(dateFromDayKey(fromDayKey).getTime() - 86400000));

    var updated = state.tasks.filter(function (t) {
      if (t.recurrenceId !== recurrenceId) return true;
      return t.dayKey < fromDayKey;
    });
    updated = updated.map(function (t) {
      if (t.id === recurrenceId && t.recurrence) {
        var newUntil = (t.recurrenceUntil && t.recurrenceUntil < dayBefore) ? t.recurrenceUntil : dayBefore;
        return Object.assign({}, t, { recurrenceUntil: newUntil });
      }
      return t;
    });
    saveTasks(updated);
    render();
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  /* ============================== Task modal ============================== */
  var modalState = { editingId: null, dayKey: null, priority: "standard", category: "other", recurrence: "none", recurrenceUntil: "", subtasks: [] };

  function openTaskModal(taskId, dayKeyForNew) {
    var backdrop = document.getElementById("taskModalBackdrop");
    var deleteBtn = document.getElementById("taskModalDelete");
    if (taskId) {
      materializeIfNeeded(taskId);
      var task = state.tasks.find(function (t) { return t.id === taskId; });
      if (!task) return;
      modalState = {
        editingId: taskId,
        dayKey: task.dayKey,
        priority: task.priority,
        category: task.category,
        recurrence: task.recurrence || "none",
        recurrenceUntil: task.recurrenceUntil || "",
        subtasks: task.subtasks ? task.subtasks.map(function (s) { return Object.assign({}, s); }) : [],
      };
      document.getElementById("taskModalTitle").textContent = "Edit Task";
      document.getElementById("taskTitleInput").value = task.title;
      document.getElementById("taskDescInput").value = task.description || "";
      deleteBtn.style.display = "block";
    } else {
      modalState = { editingId: null, dayKey: dayKeyForNew, priority: "standard", category: "other", recurrence: "none", recurrenceUntil: "", subtasks: [] };
      document.getElementById("taskModalTitle").textContent = "New Task";
      document.getElementById("taskTitleInput").value = "";
      document.getElementById("taskDescInput").value = "";
      deleteBtn.style.display = "none";
    }
    var dayBtn = document.getElementById("taskModalDay");
    if (taskId) {
      dayBtn.innerHTML = escapeHtml(formatDayNameLong(modalState.dayKey)) + ' <span style="opacity:.7;">▾</span>';
      dayBtn.style.cursor = "pointer";
      dayBtn.onclick = function () { openDayPicker("moveDay", computeFormRecurrenceInfo()); };
    } else {
      dayBtn.textContent = formatDayNameLong(modalState.dayKey);
      dayBtn.style.cursor = "default";
      dayBtn.onclick = null;
    }
    document.getElementById("subtaskInput").value = "";
    updateRecurrenceUntilUI();
    renderPriorityRow();
    renderCategoryGrid();
    renderRecurrenceRow();
    renderSubtaskList();
    updateSaveEnabled();
    backdrop.classList.remove("hidden");
    document.getElementById("taskTitleInput").focus();
  }
  function closeTaskModal() { document.getElementById("taskModalBackdrop").classList.add("hidden"); }

  function formatDayNameLong(dayKey) {
    var names = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var d = dateFromDayKey(dayKey);
    return names[d.getDay()] + ", " + d.getDate() + " " + MONTH_SHORT[d.getMonth()];
  }

  /* ============================== Day picker (move task to another day) ============================== */
  var dpState = { year: today.getFullYear(), month: today.getMonth() };
  var dpTarget = "moveDay"; // "moveDay" | "recurrenceUntil" | "quickMove"
  var dpViewMode = "day"; // "day" | "month"
  var dpRecurrenceInfo = null; // { recurrence, startDayKey, untilDayKey } | null
  var dpQuickMoveTaskId = null; // set when dpTarget === "quickMove"
  var dpSuppressClick = false;

  function computeFormRecurrenceInfo() {
    if (modalState.recurrence === "none") return null;
    return { recurrence: modalState.recurrence, startDayKey: modalState.dayKey, untilDayKey: modalState.recurrenceUntil || null };
  }

  // For the "Repeat Until" picker, only today (or the task's own start day,
  // whichever is later) and beyond should be reachable/selectable.
  function dpFloorDate() {
    var todayFloor = new Date(today);
    todayFloor.setHours(0, 0, 0, 0);
    if (dpTarget === "recurrenceUntil") {
      // A recurrence can't be told to end before it even starts.
      var startFloor = dateFromDayKey(modalState.dayKey);
      startFloor.setHours(0, 0, 0, 0);
      return startFloor.getTime() > todayFloor.getTime() ? startFloor : todayFloor;
    }
    if (dpTarget === "jumpToWeek") return null; // browsing past weeks in the planner is normal
    // "moveDay" and "quickMove": you can't move/schedule a task into the past.
    return todayFloor;
  }

  function dpClampToFloor() {
    var floor = dpFloorDate();
    if (!floor) return;
    if (dpState.year < floor.getFullYear() || (dpState.year === floor.getFullYear() && dpState.month < floor.getMonth())) {
      dpState.year = floor.getFullYear();
      dpState.month = floor.getMonth();
    }
  }

  function openDayPicker(target, recurrenceInfo, quickMoveTaskId, anchorDate) {
    dpTarget = target || "moveDay";
    dpRecurrenceInfo = recurrenceInfo || null;
    dpQuickMoveTaskId = quickMoveTaskId || null;
    var baseKey;
    if (dpTarget === "quickMove") {
      var qt = state.tasks.find(function (t) { return t.id === quickMoveTaskId; });
      baseKey = qt ? qt.dayKey : formatDayKey(today);
    } else if (dpTarget === "recurrenceUntil") {
      baseKey = modalState.recurrenceUntil || modalState.dayKey;
    } else if (dpTarget === "jumpToWeek") {
      baseKey = anchorDate ? formatDayKey(anchorDate) : formatDayKey(today);
    } else if (dpTarget === "bulkMove") {
      baseKey = formatDayKey(today);
    } else {
      baseKey = modalState.dayKey;
    }
    var d = dateFromDayKey(baseKey);
    dpState.year = d.getFullYear();
    dpState.month = d.getMonth();
    dpClampToFloor();
    showDpView("day");
    renderDayPickerModal();
    document.getElementById("dayPickerModalBackdrop").classList.remove("hidden");
  }
  function closeDayPicker() {
    document.getElementById("dayPickerModalBackdrop").classList.add("hidden");
  }

  function showDpView(mode) {
    dpViewMode = mode;
    document.getElementById("dpDayView").style.display = mode === "day" ? "block" : "none";
    document.getElementById("dpMonthView").style.display = mode === "month" ? "block" : "none";
  }

  function isMonthEntirelyBeforeFloor(year, monthIndex, floor) {
    if (!floor) return false;
    var lastDayOfThatMonth = new Date(year, monthIndex + 1, 0);
    lastDayOfThatMonth.setHours(0, 0, 0, 0);
    return lastDayOfThatMonth.getTime() < floor.getTime();
  }

  // Days (within the given month) that the described recurrence pattern
  // would land on - used to lightly highlight them in orange while the
  // person is picking a date, so they can see the pattern at a glance.
  function computeRecurringHighlightDays(info, year, month) {
    var result = {};
    if (!info || !info.recurrence || !info.startDayKey) return result;
    var startDate = dateFromDayKey(info.startDayKey);
    startDate.setHours(0, 0, 0, 0);
    var untilDate = info.untilDayKey ? dateFromDayKey(info.untilDayKey) : null;
    if (untilDate) untilDate.setHours(0, 0, 0, 0);
    var weeks = buildMonthGrid(year, month);
    weeks.forEach(function (week) {
      week.forEach(function (day) {
        if (!day) return;
        var d = new Date(day); d.setHours(0, 0, 0, 0);
        if (d.getTime() < startDate.getTime()) return;
        if (untilDate && d.getTime() > untilDate.getTime()) return;
        var matches = info.recurrence === "daily" ||
          (info.recurrence === "weekly" && d.getDay() === startDate.getDay()) ||
          (info.recurrence === "monthly" && isMonthlyMatch(d, startDate));
        if (matches) result[formatDayKey(d)] = true;
      });
    });
    return result;
  }

  function renderMonthGridView() {
    var floor = dpFloorDate();
    document.getElementById("dpMonthViewYearLabel").textContent = String(dpState.year);

    var prevYearBtn = document.getElementById("dpMonthViewPrevYear");
    var disablePrevYear = !!(floor && dpState.year <= floor.getFullYear());
    prevYearBtn.disabled = disablePrevYear;
    prevYearBtn.style.opacity = disablePrevYear ? "0.3" : "1";

    var grid = document.getElementById("dpMonthGrid");
    var html = "";
    for (var m = 0; m < 12; m++) {
      var disabled = isMonthEntirelyBeforeFloor(dpState.year, m, floor);
      var isThisMonth = dpState.year === today.getFullYear() && m === today.getMonth();
      html += '<button class="month-grid-cell' + (disabled ? " disabled" : "") + (isThisMonth ? " current" : "") + '"' +
        (disabled ? " disabled" : ' data-month="' + m + '"') + '>' + MONTH_SHORT[m] + '</button>';
    }
    grid.innerHTML = html;
    grid.querySelectorAll("[data-month]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        dpState.month = parseInt(btn.getAttribute("data-month"), 10);
        showDpView("day");
        renderDayPickerModal();
      });
    });
  }

  function renderDayPickerModal() {
    var monthLabelEl = document.getElementById("dpMonthLabel");
    monthLabelEl.innerHTML = escapeHtml(MONTH_NAMES[dpState.month] + " " + dpState.year) + ' <span class="month-label-chevron">▾</span>';
    var wdRow = document.getElementById("dpWeekdayRow");
    wdRow.innerHTML = DAY_LABELS.map(function (l, i) {
      return '<span class="weekday-cell' + (i >= 5 ? " weekend" : "") + '">' + l[0] + '</span>';
    }).join("");

    var floor = dpFloorDate();
    var atFloorMonth = floor && dpState.year === floor.getFullYear() && dpState.month === floor.getMonth();
    var prevMonthBtn = document.getElementById("dpPrevMonth");
    prevMonthBtn.disabled = !!atFloorMonth;
    prevMonthBtn.style.opacity = atFloorMonth ? "0.3" : "1";

    var relevantSelected = dpTarget === "recurrenceUntil" ? modalState.recurrenceUntil
      : (dpTarget === "quickMove" || dpTarget === "jumpToWeek" || dpTarget === "bulkMove") ? null
      : modalState.dayKey;
    var currentWeekKeys = dpTarget === "jumpToWeek" ? currentWeekDays().map(formatDayKey) : null;
    var previewDays = computeRecurringHighlightDays(dpRecurrenceInfo, dpState.year, dpState.month);
    var weeks = buildMonthGrid(dpState.year, dpState.month);
    var html = "";
    weeks.forEach(function (week) {
      var rowIsCurrentWeek = false;
      if (currentWeekKeys) {
        for (var wi = 0; wi < week.length; wi++) {
          if (week[wi] && currentWeekKeys.indexOf(formatDayKey(week[wi])) !== -1) { rowIsCurrentWeek = true; break; }
        }
      }
      html += '<div class="week-row' + (rowIsCurrentWeek ? " current-week" : "") + '">';
      week.forEach(function (day) {
        if (!day) { html += '<div class="cal-day-cell"></div>'; return; }
        var dKey = formatDayKey(day);
        var isToday = isSameDay(day, today);
        var isSelected = dKey === relevantSelected;
        var otherMonth = day.getMonth() !== dpState.month;
        var isDisabled = !!(floor && day.getTime() < floor.getTime());
        var isPreview = !!previewDays[dKey];
        html += '<div class="cal-day-cell"' + (isDisabled ? "" : ' data-pickday="' + dKey + '"') + '>' +
          '<div class="cal-day-inner' + (isToday ? " today" : "") + (isSelected ? " selected" : "") + (otherMonth ? " other-month" : "") + (isDisabled ? " disabled" : "") + (isPreview ? " preview" : "") + '">' +
          day.getDate() + '</div></div>';
      });
      html += '</div>';
    });
    var weeksEl = document.getElementById("dpWeeks");
    weeksEl.innerHTML = html;
    weeksEl.querySelectorAll("[data-pickday]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (dpSuppressClick) return;
        var picked = el.getAttribute("data-pickday");
        if (dpTarget === "recurrenceUntil") {
          modalState.recurrenceUntil = picked;
          updateRecurrenceUntilUI();
        } else if (dpTarget === "quickMove") {
          closeDayPicker();
          moveTaskToDay(dpQuickMoveTaskId, picked);
          return;
        } else if (dpTarget === "jumpToWeek") {
          var targetMonday = getWeekMonday(dateFromDayKey(picked));
          var todayMonday = getWeekMonday(new Date(today));
          state.weekOffset = Math.round((targetMonday.getTime() - todayMonday.getTime()) / (7 * 86400000));
          closeDayPicker();
          render();
          return;
        } else if (dpTarget === "bulkMove") {
          closeDayPicker();
          bulkMoveToDay(picked);
          return;
        } else {
          modalState.dayKey = picked;
          var dayBtn = document.getElementById("taskModalDay");
          dayBtn.innerHTML = escapeHtml(formatDayNameLong(modalState.dayKey)) + ' <span style="opacity:.7;">▾</span>';
        }
        closeDayPicker();
      });
    });
  }

  function dpGoToMonth(delta) {
    dpState.month += delta;
    if (dpState.month < 0) { dpState.month = 11; dpState.year--; }
    else if (dpState.month > 11) { dpState.month = 0; dpState.year++; }
  }

  function animateDpMonthChange(delta) {
    if (delta < 0 && document.getElementById("dpPrevMonth").disabled) return;
    var weeksEl = document.getElementById("dpWeeks");
    var outX = delta > 0 ? "-22px" : "22px";
    var inX = delta > 0 ? "22px" : "-22px";
    weeksEl.style.transition = "transform .14s ease, opacity .14s ease";
    weeksEl.style.transform = "translateX(" + outX + ")";
    weeksEl.style.opacity = "0";
    setTimeout(function () {
      dpGoToMonth(delta);
      dpClampToFloor();
      renderDayPickerModal();
      var freshWeeksEl = document.getElementById("dpWeeks");
      freshWeeksEl.style.transition = "none";
      freshWeeksEl.style.transform = "translateX(" + inX + ")";
      freshWeeksEl.style.opacity = "0";
      void freshWeeksEl.offsetWidth; // force reflow so the next transition actually animates
      freshWeeksEl.style.transition = "transform .14s ease, opacity .14s ease";
      freshWeeksEl.style.transform = "translateX(0)";
      freshWeeksEl.style.opacity = "1";
    }, 140);
  }

  function attachDpSwipe(weeksEl) {
    var startX = 0, startY = 0, tracking = false, moved = false;
    weeksEl.addEventListener("pointerdown", function (e) {
      startX = e.clientX; startY = e.clientY; tracking = true; moved = false;
    });
    weeksEl.addEventListener("pointermove", function (e) {
      if (!tracking) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!moved && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) moved = true;
    });
    function endSwipe(e) {
      if (!tracking) return;
      tracking = false;
      if (!moved) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) < 40) return;
      dpSuppressClick = true;
      setTimeout(function () { dpSuppressClick = false; }, 300);
      animateDpMonthChange(dx < 0 ? 1 : -1);
    }
    weeksEl.addEventListener("pointerup", endSwipe);
    weeksEl.addEventListener("pointercancel", function () { tracking = false; });
  }

  function renderPriorityRow() {
    document.querySelectorAll("#priorityRow .option-pill").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-priority") === modalState.priority);
    });
  }
  function renderRecurrenceRow() {
    document.querySelectorAll("#recurrenceRow .option-pill").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-recurrence") === modalState.recurrence);
    });
    updateRecurrenceUntilUI();
  }
  function updateRecurrenceUntilUI() {
    var wrap = document.getElementById("recurrenceUntilWrap");
    wrap.style.display = modalState.recurrence === "none" ? "none" : "block";
    var label = document.getElementById("recurrenceUntilLabel");
    var clearBtn = document.getElementById("recurrenceUntilClear");
    if (modalState.recurrenceUntil) {
      label.textContent = formatDayNameLong(modalState.recurrenceUntil);
      clearBtn.style.display = "flex";
    } else {
      label.textContent = "No end date";
      clearBtn.style.display = "none";
    }
  }
  function renderCategoryGrid() {
    var grid = document.getElementById("categoryGrid");
    grid.innerHTML = CATEGORIES.map(function (c) {
      return '<button class="category-option' + (modalState.category === c.value ? " active" : "") + '" data-category="' + c.value + '"><span class="em">' + c.emoji + '</span>' + c.label + '</button>';
    }).join("");
    grid.querySelectorAll(".category-option").forEach(function (btn) {
      btn.addEventListener("click", function () {
        modalState.category = btn.getAttribute("data-category");
        renderCategoryGrid();
      });
    });
  }
  function renderSubtaskList() {
    var wrap = document.getElementById("subtaskList");
    wrap.innerHTML = modalState.subtasks.map(function (s) {
      return '<div class="subtask-row">' +
        '<button class="subtask-check' + (s.completed ? " done" : "") + '" data-subtoggle="' + s.id + '">' + (s.completed ? "✓" : "") + '</button>' +
        '<span class="subtask-text' + (s.completed ? " done" : "") + '">' + escapeHtml(s.title) + '</span>' +
        '<button class="subtask-remove" data-subremove="' + s.id + '">✕</button>' +
        '</div>';
    }).join("");
    wrap.querySelectorAll("[data-subtoggle]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-subtoggle");
        modalState.subtasks = modalState.subtasks.map(function (s) { return s.id === id ? Object.assign({}, s, { completed: !s.completed }) : s; });
        renderSubtaskList();
      });
    });
    wrap.querySelectorAll("[data-subremove]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-subremove");
        var item = modalState.subtasks.find(function (s) { return s.id === id; });
        showConfirm({
          title: "Delete checklist item?",
          message: item ? item.title : undefined,
          buttons: [
            { label: "Cancel", variant: "neutral", isCancel: true },
            {
              label: "Delete", variant: "danger", onPress: function () {
                modalState.subtasks = modalState.subtasks.filter(function (s) { return s.id !== id; });
                renderSubtaskList();
              }
            },
          ],
        });
      });
    });
  }
  function addSubtaskFromInput() {
    var input = document.getElementById("subtaskInput");
    var title = input.value.trim();
    if (!title) return;
    modalState.subtasks.push({ id: uid(), title: title, completed: false });
    input.value = "";
    renderSubtaskList();
  }
  function updateSaveEnabled() {
    var titleOk = document.getElementById("taskTitleInput").value.trim().length > 0;
    document.getElementById("taskModalSave").disabled = !titleOk;
  }

  function saveTaskModal() {
    var title = document.getElementById("taskTitleInput").value.trim();
    if (!title) return;
    var description = document.getElementById("taskDescInput").value.trim() || undefined;

    if (modalState.editingId) {
      var originalTask = state.tasks.find(function (t) { return t.id === modalState.editingId; });
      var dayChanged = originalTask && modalState.dayKey !== originalTask.dayKey;
      var newOrder = originalTask ? originalTask.order : 0;
      if (dayChanged) {
        newOrder = state.tasks
          .filter(function (t) { return t.dayKey === modalState.dayKey && t.id !== modalState.editingId; })
          .reduce(function (m, t) { return Math.max(m, t.order); }, -1) + 1;
      }
      var updated = state.tasks.map(function (t) {
        if (t.id !== modalState.editingId) return t;
        var recurrence = modalState.recurrence === "none" ? undefined : modalState.recurrence;
        return Object.assign({}, t, {
          title: title,
          dayKey: modalState.dayKey,
          order: newOrder,
          priority: modalState.priority,
          category: modalState.category,
          subtasks: modalState.subtasks.length ? modalState.subtasks : undefined,
          recurrence: recurrence,
          recurrenceId: recurrence ? (t.recurrenceId || t.id) : t.recurrenceId,
          recurrenceUntil: recurrence ? (modalState.recurrenceUntil || undefined) : undefined,
          description: description,
        });
      });
      saveTasks(updated);
      if (modalState.recurrence !== "none") lifetime.hasRecurring = true;
      if (description) lifetime.hasDescription = true;
      saveLifetime();
    } else {
      var dayTasksCount = state.tasks.filter(function (t) { return t.dayKey === modalState.dayKey; })
        .reduce(function (m, t) { return Math.max(m, t.order); }, -1);
      var id = uid();
      var recurrence = modalState.recurrence === "none" ? undefined : modalState.recurrence;
      var newTask = {
        id: id,
        title: title,
        dayKey: modalState.dayKey,
        completed: false,
        priority: modalState.priority,
        category: modalState.category,
        createdAt: Date.now(),
        order: dayTasksCount + 1,
        subtasks: modalState.subtasks.length ? modalState.subtasks : undefined,
        recurrence: recurrence,
        recurrenceId: recurrence ? id : undefined,
        recurrenceUntil: recurrence ? (modalState.recurrenceUntil || undefined) : undefined,
        description: description,
      };
      trackTaskCreated(newTask);
      saveTasks(state.tasks.concat([newTask]));
    }
    closeTaskModal();
    render();
  }

  function deleteTaskFromModal() {
    if (!modalState.editingId) return;
    requestDeleteConfirm(modalState.editingId, null, function () {
      closeTaskModal();
    });
  }

  /* ============================== Month calendar modal ============================== */
  function buildMonthGrid(year, month) {
    var firstDay = new Date(year, month, 1);
    var lastDay = new Date(year, month + 1, 0);
    var startDow = firstDay.getDay();
    var offset = startDow === 0 ? 6 : startDow - 1;
    var days = [];
    for (var i = 0; i < offset; i++) days.push(null);
    for (var d = 1; d <= lastDay.getDate(); d++) days.push(new Date(year, month, d));
    while (days.length % 7 !== 0) days.push(null);
    var weeks = [];
    for (var j = 0; j < days.length; j += 7) weeks.push(days.slice(j, j + 7));
    // Always return exactly 6 week-rows so calendar modals never change
    // height when switching between 4/5/6-row months.
    while (weeks.length < 6) weeks.push([null, null, null, null, null, null, null]);
    return weeks;
  }

  // Opens the shared day-picker in "jump to week" mode: picking any day
  // (past or future - no floor restriction here) navigates the planner to
  // the week containing it.
  function openJumpToWeekPicker() {
    openDayPicker("jumpToWeek", null, null, currentWeekDays()[0]);
  }

  /* ============================== Stats modal ============================== */
  function openStatsModal() {
    var weekDays = currentWeekDays();
    var keys = weekDays.map(formatDayKey);
    var allTasks = computeDisplayTasks();
    var weekTasks = allTasks.filter(function (t) { return keys.indexOf(t.dayKey) !== -1; });

    document.getElementById("statsWeekLabel").textContent = formatWeekLabel(weekDays[0]);
    var content = document.getElementById("statsContent");

    if (weekTasks.length === 0) {
      content.innerHTML = '<p class="stats-empty">No tasks this week yet.</p>';
    } else {
      var total = weekTasks.length;
      var completed = weekTasks.filter(function (t) { return t.completed; }).length;
      var pct = Math.round((completed / total) * 100);
      var high = weekTasks.filter(function (t) { return t.priority === "high"; }).length;
      var highDone = weekTasks.filter(function (t) { return t.priority === "high" && t.completed; }).length;

      var byCat = {};
      weekTasks.forEach(function (t) {
        if (!byCat[t.category]) byCat[t.category] = { total: 0, done: 0 };
        byCat[t.category].total++;
        if (t.completed) byCat[t.category].done++;
      });
      var catRows = Object.keys(byCat).sort(function (a, b) { return byCat[b].total - byCat[a].total; });

      var html = '<div class="stats-progress-row"><span class="stats-big">' + pct + '%</span>' +
        '<span class="stats-label">' + completed + ' of ' + total + ' tasks completed</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
      if (high > 0) html += '<div class="stats-meta">High priority: ' + highDone + '/' + high + ' done</div>';
      html += '<p class="section-label">By category</p>';
      catRows.forEach(function (cat) {
        var info = CATEGORY_MAP[cat] || CATEGORY_MAP.other;
        var e = byCat[cat];
        var p = Math.round((e.done / e.total) * 100);
        html += '<div class="cat-stat-row"><span class="cat-stat-emoji">' + info.emoji + '</span>' +
          '<span class="cat-stat-label">' + info.label + '</span>' +
          '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + p + '%"></div></div>' +
          '<span class="cat-stat-count">' + e.done + '/' + e.total + '</span></div>';
      });
      content.innerHTML = html;
    }
    document.getElementById("statsModalBackdrop").classList.remove("hidden");
  }
  function closeStatsModal() { document.getElementById("statsModalBackdrop").classList.add("hidden"); }

  /* ============================== Share ============================== */
  function shareWeek() {
    var weekDays = currentWeekDays();
    var allTasks = computeDisplayTasks();
    var lines = ["Planner — " + formatWeekLabel(weekDays[0]), ""];
    weekDays.forEach(function (date) {
      var dKey = formatDayKey(date);
      var dayIndex = date.getDay() === 0 ? 6 : date.getDay() - 1;
      var dayTasks = allTasks.filter(function (t) {
        return t.dayKey === dKey && (state.filterCategories.length === 0 || state.filterCategories.indexOf(t.category) !== -1);
      }).sort(function (a, b) { return a.order - b.order || a.createdAt - b.createdAt; });
      lines.push(DAY_LABELS[dayIndex] + " " + date.getDate());
      if (dayTasks.length === 0) {
        lines.push("  (no tasks)");
      } else {
        dayTasks.forEach(function (t) { lines.push("  " + (t.completed ? "[x]" : "[ ]") + " " + t.title); });
      }
      lines.push("");
    });
    var text = lines.join("\n");

    if (navigator.share) {
      navigator.share({ title: "Weekly Planner", text: text }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("Week summary copied to clipboard");
      }).catch(function () { showToast("Could not copy"); });
    } else {
      window.prompt("Skopiuj podsumowanie tygodnia:", text);
    }
  }

  function showToast(msg) {
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  /* ============================== Master render ============================== */
  function render() {
    renderHeader();
    renderFilterChips();
    renderDayList();
    updateSelectBar();
  }

  /* ============================== Selection mode (bulk actions) ============================== */

  function toggleSelectionMode() {
    state.selectionMode = !state.selectionMode;
    state.selectedTaskIds = [];
    var btn = document.getElementById("selectModeBtn");
    if (btn) btn.classList.toggle("active", state.selectionMode);
    render();
  }
  function exitSelectionMode() {
    state.selectionMode = false;
    state.selectedTaskIds = [];
    var btn = document.getElementById("selectModeBtn");
    if (btn) btn.classList.remove("active");
    render();
  }
  function toggleTaskSelection(id) {
    var idx = state.selectedTaskIds.indexOf(id);
    if (idx !== -1) state.selectedTaskIds.splice(idx, 1);
    else state.selectedTaskIds.push(id);
    render();
  }
  function updateSelectBar() {
    var bar = document.getElementById("selectBar");
    if (!bar) return;
    if (state.selectionMode && state.selectedTaskIds.length > 0) {
      bar.classList.remove("hidden");
      document.getElementById("selectCount").textContent =
        state.selectedTaskIds.length + (state.selectedTaskIds.length === 1 ? " selected" : " selected");
    } else {
      bar.classList.add("hidden");
    }
  }

  function openBulkMoveModal() {
    if (state.selectedTaskIds.length === 0) return;
    document.getElementById("bulkMoveCount").textContent =
      "Applies to " + state.selectedTaskIds.length + " task" + (state.selectedTaskIds.length === 1 ? "" : "s") + ", each relative to its own day.";
    document.getElementById("bulkMoveModalBackdrop").classList.remove("hidden");
  }
  function closeBulkMoveModal() {
    document.getElementById("bulkMoveModalBackdrop").classList.add("hidden");
  }

  function bulkMoveByAction(action) {
    var ids = state.selectedTaskIds.slice();
    ids.forEach(function (id) { quickMoveTask(id, action, true); });
    closeBulkMoveModal();
    exitSelectionMode();
  }
  function bulkMoveToDay(dayKey) {
    var ids = state.selectedTaskIds.slice();
    ids.forEach(function (id) { moveTaskToDay(id, dayKey, true); });
    closeBulkMoveModal();
    exitSelectionMode();
  }

  function bulkDeleteTasks() {
    var ids = state.selectedTaskIds.slice();
    if (ids.length === 0) return;
    showConfirm({
      title: "Delete " + ids.length + " task" + (ids.length === 1 ? "" : "s") + "?",
      message: "This can't be undone. For recurring tasks in the selection, only that single occurrence is removed.",
      buttons: [
        { label: "Cancel", variant: "neutral", isCancel: true },
        {
          label: "Delete", variant: "danger", onPress: function () {
            ids.forEach(function (id) { deleteTask(id); });
            exitSelectionMode();
          }
        },
      ],
    });
  }

  /* ============================== Wire up static controls ============================== */
  function init() {
    loadData();
    loadProfile();
    updateMenuAvatar();
    loadLifetime();
    document.getElementById("notesInput").value = state.notes;

    document.getElementById("menuBtn").addEventListener("click", openDrawer);
    document.getElementById("drawerBackdrop").addEventListener("click", function (e) { if (e.target === this) closeDrawer(); });
    document.getElementById("headerCenterBtn").addEventListener("click", openJumpToWeekPicker);
    document.getElementById("statsBtn").addEventListener("click", openStatsModal);
    document.getElementById("loadMoreWeekBtn").addEventListener("click", function () {
      state.multiWeekMode = !state.multiWeekMode;
      document.getElementById("loadMoreWeekBtn").classList.toggle("active", state.multiWeekMode);
      render();
    });
    document.getElementById("filterSummaryBtn").addEventListener("click", openCategoryFilterModal);
    document.getElementById("categoryFilterModalClose").addEventListener("click", closeCategoryFilterModal);
    document.getElementById("categoryFilterModalBackdrop").addEventListener("click", function (e) { if (e.target === this) closeCategoryFilterModal(); });
    document.getElementById("avatarChoiceModalClose").addEventListener("click", closeAvatarChoiceModal);
    document.getElementById("avatarChoiceModalBackdrop").addEventListener("click", function (e) { if (e.target === this) closeAvatarChoiceModal(); });
    document.getElementById("selectModeBtn").addEventListener("click", toggleSelectionMode);
    document.getElementById("selectCancelBtn").addEventListener("click", exitSelectionMode);
    document.getElementById("selectDeleteBtn").addEventListener("click", bulkDeleteTasks);
    document.getElementById("selectMoveBtn").addEventListener("click", openBulkMoveModal);
    document.getElementById("bulkMoveModalClose").addEventListener("click", closeBulkMoveModal);
    document.getElementById("bulkMoveModalBackdrop").addEventListener("click", function (e) { if (e.target === this) closeBulkMoveModal(); });
    document.querySelectorAll("[data-bulk-move]").forEach(function (btn) {
      btn.addEventListener("click", function () { bulkMoveByAction(btn.getAttribute("data-bulk-move")); });
    });
    document.getElementById("bulkMoveCalBtn").addEventListener("click", function () {
      closeBulkMoveModal();
      openDayPicker("bulkMove");
    });
    document.getElementById("sortBtn").addEventListener("click", function () {
      state.sortByPriority = !state.sortByPriority;
      render();
    });
    document.getElementById("todayBtnLeft").addEventListener("click", function () {
      state.weekOffset = 0;
      render();
    });
    document.getElementById("todayBtnRight").addEventListener("click", function () {
      state.weekOffset = 0;
      render();
    });
    document.getElementById("prevWeekBtn").addEventListener("click", function () { state.weekOffset--; render(); });
    document.getElementById("nextWeekBtn").addEventListener("click", function () { state.weekOffset++; render(); });

    var notesTimer = null;
    var notesInput = document.getElementById("notesInput");
    notesInput.addEventListener("input", function (e) {
      var val = e.target.value;
      if (notesTimer) clearTimeout(notesTimer);
      notesTimer = setTimeout(function () { saveNotes(val); }, 500);
      // Keep the expanded height in sync as the person types/deletes lines.
      if (isNotesExpanded) expandNotes();
    });
    notesInput.addEventListener("focus", function () { expandNotes(); });
    notesInput.addEventListener("blur", function () { collapseNotes(); });
    document.getElementById("notesDeleteAllBtn").addEventListener("pointerdown", function (e) {
      e.preventDefault(); // keep focus on the textarea so it doesn't collapse before the click registers
    });
    document.getElementById("notesDeleteAllBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      requestDeleteAllNotes();
    });

    // Task modal wiring
    document.getElementById("taskTitleInput").addEventListener("input", updateSaveEnabled);
    document.getElementById("taskModalCancel").addEventListener("click", closeTaskModal);
    document.getElementById("taskModalSave").addEventListener("click", saveTaskModal);
    document.getElementById("taskModalDelete").addEventListener("click", deleteTaskFromModal);
    document.getElementById("taskModalBackdrop").addEventListener("click", function (e) {
      if (e.target === this) closeTaskModal();
    });
    document.querySelectorAll("#priorityRow .option-pill").forEach(function (btn) {
      btn.addEventListener("click", function () { modalState.priority = btn.getAttribute("data-priority"); renderPriorityRow(); });
    });
    document.querySelectorAll("#recurrenceRow .option-pill").forEach(function (btn) {
      btn.addEventListener("click", function () { modalState.recurrence = btn.getAttribute("data-recurrence"); renderRecurrenceRow(); });
    });
    document.getElementById("recurrenceUntilBtn").addEventListener("click", function () { openDayPicker("recurrenceUntil", computeFormRecurrenceInfo()); });
    document.getElementById("recurrenceUntilClear").addEventListener("click", function () {
      modalState.recurrenceUntil = "";
      updateRecurrenceUntilUI();
    });
    document.getElementById("subtaskAddBtn").addEventListener("click", addSubtaskFromInput);
    document.getElementById("subtaskInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); addSubtaskFromInput(); }
    });

    // Day picker modal wiring (move-task-to-day, inside the task edit sheet)
    document.getElementById("dpPrevMonth").addEventListener("click", function () {
      dpState.month--; if (dpState.month < 0) { dpState.month = 11; dpState.year--; }
      dpClampToFloor();
      renderDayPickerModal();
    });
    document.getElementById("dpNextMonth").addEventListener("click", function () {
      dpState.month++; if (dpState.month > 11) { dpState.month = 0; dpState.year++; }
      renderDayPickerModal();
    });
    attachDpSwipe(document.getElementById("dpWeeks"));
    document.getElementById("dpMonthLabel").addEventListener("click", function () {
      showDpView("month");
      renderMonthGridView();
    });
    document.getElementById("dpMonthViewPrevYear").addEventListener("click", function () {
      dpState.year--;
      renderMonthGridView();
    });
    document.getElementById("dpMonthViewNextYear").addEventListener("click", function () {
      dpState.year++;
      renderMonthGridView();
    });
    document.getElementById("dayPickerModalClose").addEventListener("click", closeDayPicker);
    document.getElementById("dayPickerModalBackdrop").addEventListener("click", function (e) { if (e.target === this) closeDayPicker(); });

    // Stats modal wiring
    document.getElementById("statsModalClose").addEventListener("click", closeStatsModal);
    document.getElementById("statsModalBackdrop").addEventListener("click", function (e) { if (e.target === this) closeStatsModal(); });

    document.getElementById("confirmModalBackdrop").addEventListener("click", function (e) { if (e.target === this) cancelConfirm(); });

    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      closeTaskModal(); closeDayPicker(); closeStatsModal(); closeBulkMoveModal(); closeDrawer(); closeCategoryFilterModal(); closeAvatarChoiceModal(); cancelConfirm();
    });

    render();
  }

  // iOS Safari's 100dvh occasionally under-reports the true visible height
  // right after load or a keyboard/orientation change. Measuring the real
  // viewport in JS and feeding it back as a CSS var is the standard,
  // reliable fix - it guarantees the app always fills the actual screen.
  function setAppHeightVar() {
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty("--app-height", h + "px");
  }
  setAppHeightVar();
  window.addEventListener("resize", setAppHeightVar);
  window.addEventListener("orientationchange", setAppHeightVar);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", setAppHeightVar);

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
