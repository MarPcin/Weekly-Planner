<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0F1117" />
<title>Weekly Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%236366F1%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>P</text></svg>" />

<!-- iOS "Add to Home Screen" support -->
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Weekly" />
<style>
  :root {
    --bg: #0F1117;
    --surface: #1A1D2E;
    --surface-elevated: #222640;
    --border: #2A2F4A;
    --accent: #6366F1;
    --accent-soft: rgba(99, 102, 241, 0.16);
    --today: #F59E0B;
    --today-soft: rgba(245, 158, 11, 0.10);
    --text: #F0F0FF;
    --text-secondary: #8A8FA8;
    --text-muted: #555A72;
    --danger: #EF4444;
    --priority-standard: #F0F0FF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font-family: inherit; color: inherit; }
  .hidden { display: none !important; }
  button { transition: transform .1s ease, opacity .1s ease; }
  button:active { transform: scale(0.94); opacity: 0.8; }
  button { cursor: pointer; background: none; border: none; }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh; /* real iOS viewport height, excludes Safari's collapsing toolbar/keyboard area */
    height: calc(var(--app-height, 100dvh)); /* JS-measured fallback, covers iOS quirks where dvh under-reports */
    max-width: 640px;
    margin: 0 auto;
    background: var(--bg);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    overflow: hidden; /* the page itself never scrolls - only .day-list does, so the header can't scroll away */
  }

  /* ---------- Header ---------- */
  .header {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 12px;
    padding-top: calc(12px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
  }
  .header-left { flex-shrink: 0; z-index: 1; }
  .icon-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-elevated); }
  .icon-btn.active { background: var(--accent-soft); color: var(--accent); }
  .menu-btn {
    width: auto; flex-direction: column; gap: 3px; padding: 3px 6px;
    font-size: 15px; line-height: 1.1;
  }
  .menu-avatar {
    width: 22px; height: 22px; border-radius: 11px; overflow: hidden;
    background: var(--surface-elevated); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .menu-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .menu-btn-label { font-size: 8px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
  .header-center-group {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    margin-top: calc(env(safe-area-inset-top) / 2);
    display: flex; align-items: center; gap: 4px;
  }
  .header-center {
    width: 120px; max-width: 50vw;
    text-align: center; background: var(--surface-elevated);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 5px 4px; cursor: pointer;
    overflow: hidden;
  }
  .header-center:hover { border-color: var(--accent); }
  .header-title {
    font-size: 18px; font-weight: 800; letter-spacing: -0.4px;
    background: linear-gradient(120deg, var(--accent), #9b9dfb);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .header-week { font-size: 10px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-right { display: flex; align-items: center; gap: 2px; flex-shrink: 0; margin-left: auto; z-index: 1; }
  .today-btn {
    padding: 6px 12px; border-radius: 16px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 12px; font-weight: 700;
    white-space: nowrap;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 8px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
  }
  .filter-summary-btn {
    flex: 0 0 auto; width: 100px; text-align: center; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis;
    padding: 7px 4px;
    border-radius: 10px;
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px; font-weight: 700;
  }
  .filter-summary-btn.has-selection { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-size: 15px; }
  .category-filter-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 6px; border-radius: 10px; text-align: left;
    background: none; border: none; color: var(--text);
  }
  .category-filter-row:hover { background: var(--surface-elevated); }
  .category-filter-row.active { background: var(--accent-soft); }
  .cf-emoji { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
  .cf-label { flex: 1; font-size: 14px; font-weight: 600; }
  .cf-check {
    width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    color: var(--accent); flex-shrink: 0;
  }
  .cf-check.done { border-color: var(--accent); background: var(--accent); color: #fff; }
  .toolbar-actions { display: flex; gap: 2px; flex-shrink: 0; margin-left: auto; }

  /* ---------- Day list ---------- */
  .day-list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .week-divider {
    display: flex; align-items: center; justify-content: center;
    padding: 14px 0 8px; margin-top: 4px;
  }
  .week-divider span {
    font-size: 11px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: .8px;
    background: var(--accent-soft); padding: 4px 12px; border-radius: 10px;
  }
  .day-section { border-bottom: 1px solid var(--border); padding: 10px 14px; }
  .day-section.today { background: var(--today-soft); }
  .day-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .day-header-left { display: flex; align-items: center; gap: 8px; }
  .date-circle {
    width: 28px; height: 28px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-elevated);
    font-size: 13px; font-weight: 700; color: var(--text-secondary);
    flex-shrink: 0;
  }
  .date-circle.today { background: var(--today); color: #0F1117; }
  .day-label {
    font-size: 12px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .day-label.weekend { color: var(--accent); opacity: .85; }
  .day-label.today { color: var(--today); }
  .task-badge {
    background: var(--surface-elevated); border-radius: 10px;
    padding: 1px 7px; font-size: 11px; font-weight: 700; color: var(--text-muted);
  }
  .add-btn {
    width: 30px; height: 30px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-elevated); border: 1px solid var(--border);
    color: var(--text-secondary); font-size: 17px; font-weight: 600;
    flex-shrink: 0;
  }
  .day-section.today .add-btn { color: var(--today); }
  .empty-row { padding: 6px 4px; }
  .empty-text { font-size: 13px; color: var(--text-muted); font-style: italic; }

  /* ---------- Task row ---------- */
  .task-list { display: flex; flex-direction: column; gap: 5px; }
  .task-row-outer {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
  }
  .swipe-panel {
    position: absolute;
    top: 0; bottom: 0;
    width: 72px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    color: #fff;
  }
  .swipe-panel.edit { left: 0; background: var(--accent); }
  .swipe-panel.delete { right: 0; background: var(--danger); }
  .task-row {
    display: flex; align-items: center;
    background: var(--surface);
    border-radius: 10px;
    min-height: 44px;
    position: relative;
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .task-row.completed { background: var(--surface); }
  .task-row.completed .priority-bar,
  .task-row.completed .task-emoji,
  .task-row.completed .recurrence-icon,
  .task-row.completed .task-number,
  .task-row.completed .subtask-badge { opacity: .4; }
  .priority-bar { width: 3px; align-self: stretch; border-radius: 1.5px; flex-shrink: 0; }
  .task-number { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-left: 8px; min-width: 16px; flex-shrink: 0; }
  .task-emoji { font-size: 14px; margin: 0 6px; flex-shrink: 0; }
  .recurrence-icon { font-size: 10px; margin-right: 3px; color: var(--text-muted); flex-shrink: 0; }
  .task-title {
    flex: 1; min-width: 0; font-size: 14px; font-weight: 500;
    padding: 10px 6px; line-height: 19px;
    color: var(--text);
    background: none; border: none; text-align: left; cursor: pointer;
  }
  .task-row.completed .task-title { text-decoration: line-through; color: var(--text-muted); }
  .desc-badge {
    font-size: 13px; color: var(--text-muted); margin-right: 6px; flex-shrink: 0;
  }
  .subtask-badge {
    display: flex; align-items: center; gap: 3px;
    background: var(--surface-elevated); border-radius: 8px;
    padding: 3px 6px; font-size: 10px; font-weight: 600; color: var(--text-muted);
    margin-right: 6px; flex-shrink: 0; white-space: nowrap;
  }
  .task-actions { display: flex; align-items: center; gap: 2px; padding-right: 6px; flex-shrink: 0; }
  .mini-btn {
    width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 12px;
  }
  .mini-btn:hover { background: var(--surface-elevated); color: var(--text-secondary); }
  .check-btn {
    width: 24px; height: 24px; border-radius: 12px;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    margin-right: 10px; flex-shrink: 0; font-size: 12px; font-weight: 700;
  }
  .task-row.selectable { cursor: pointer; }
  .select-check {
    width: 22px; height: 22px; border-radius: 11px;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    margin-left: 16px; margin-right: 8px; flex-shrink: 0;
    font-size: 12px; font-weight: 700; color: #fff;
  }
  .select-check.done { border-color: var(--accent); background: var(--accent); }
  .select-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--surface-elevated);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    flex-shrink: 0; font-size: 13px; font-weight: 600; color: var(--text-secondary);
  }
  .select-bar-actions { display: flex; gap: 8px; }
  .select-bar-btn {
    padding: 7px 12px; border-radius: 8px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 700;
  }
  .select-bar-btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* ---------- Side menu drawer ---------- */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer-backdrop.hidden { display: none; }
  .drawer-panel {
    position: absolute; left: 0; top: 0; bottom: 0; width: 45%; min-width: 235px; max-width: 320px;
    background: var(--surface); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform .28s ease;
    overflow-y: auto;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .drawer-backdrop.open .drawer-panel { transform: translateX(0); }
  .drawer-header {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 14px 10px; font-size: 16px; font-weight: 700;
    border-bottom: 1px solid var(--border); margin-bottom: 12px;
  }
  .drawer-back {
    width: 30px; height: 30px; border-radius: 8px; background: var(--surface-elevated);
    display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text);
    flex-shrink: 0;
  }
  .drawer-body { padding: 0 14px 24px; }
  .drawer-menu-list { padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; }
  .drawer-menu-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 10px;
    border-radius: 12px; background: none; text-align: left; width: 100%;
  }
  .drawer-menu-row:hover { background: var(--surface-elevated); }
  .drawer-avatar-mini {
    width: 34px; height: 34px; border-radius: 17px; background: var(--surface-elevated);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    overflow: hidden; flex-shrink: 0; border: 1px solid var(--border);
  }
  .drawer-avatar-mini img { width: 100%; height: 100%; object-fit: cover; }
  .drawer-menu-icon { width: 34px; text-align: center; font-size: 18px; flex-shrink: 0; }
  .drawer-menu-row-text { flex: 1; min-width: 0; }
  .drawer-menu-row-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .drawer-menu-row-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-chevron { color: var(--text-muted); font-size: 16px; flex-shrink: 0; }

  .profile-avatar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .profile-avatar-btn {
    width: 56px; height: 56px; border-radius: 28px; background: var(--surface-elevated);
    border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 22px; overflow: hidden; flex-shrink: 0;
  }
  .profile-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name-input {
    flex: 1; min-width: 0; background: var(--surface-elevated); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 15px; color: var(--text); outline: none;
  }
  .profile-name-input:focus { border-color: var(--accent); }
  .avatar-choice-btn {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px 12px; margin-bottom: 8px; border-radius: 12px;
    background: var(--surface-elevated); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; font-weight: 600; text-align: left;
  }
  .avatar-choice-btn:hover { border-color: var(--accent); }
  .avatar-choice-emoji { font-size: 22px; flex-shrink: 0; }
  .avatar-preset-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .avatar-preset-btn {
    width: 40px; height: 40px; border-radius: 20px; font-size: 20px;
    background: var(--surface-elevated); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-preset-btn.active { border-color: var(--accent); background: var(--accent-soft); }
  .theme-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .theme-swatch {
    width: 34px; height: 34px; border-radius: 17px; border: 2.5px solid transparent;
  }
  .theme-swatch.active { border-color: var(--text); }
  .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .badge-cell {
    background: var(--surface-elevated); border-radius: 10px; padding: 10px 4px;
    text-align: center; opacity: .35; border: 1px solid var(--border);
  }
  .badge-cell.earned { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
  .badge-emoji { font-size: 20px; margin-bottom: 3px; }
  .badge-name { font-size: 9px; font-weight: 600; color: var(--text-secondary); line-height: 1.25; }

  .drawer-task-row {
    display: flex; align-items: center; gap: 8px; background: var(--surface-elevated);
    border-radius: 10px; padding: 8px 10px; margin-bottom: 6px;
  }
  .drawer-task-row.overdue { border-left: 3px solid var(--danger); }
  .drawer-task-text { flex: 1; min-width: 0; }
  .drawer-task-title { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-task-date { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .daily-chart { display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; height: 70px; margin-bottom: 4px; }
  .daily-chart-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .daily-chart-bar-track { display: flex; align-items: flex-end; height: 52px; }
  .daily-chart-bar { width: 14px; border-radius: 4px 4px 0 0; background: var(--accent); }
  .daily-chart-col span { font-size: 9px; color: var(--text-muted); font-weight: 600; }
  .lifetime-stats-row { display: flex; gap: 12px; }
  .lifetime-stats-row > div { flex: 1; background: var(--surface-elevated); border-radius: 10px; padding: 12px; text-align: center; }
  .lifetime-num { font-size: 22px; font-weight: 800; color: var(--accent); }
  .lifetime-label { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

  /* ---------- Expandable task details panel ---------- */
  .task-details { transition: max-height .25s ease; }
  .task-details-inner { padding: 10px 4px 2px 4px; }
  .td-section-label {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .9px; margin: 12px 0 6px;
  }
  .td-section-label:first-child { margin-top: 0; }
  .td-empty { font-size: 12px; color: var(--text-muted); font-style: italic; }
  .td-subtask-outer { position: relative; overflow: hidden; border-radius: 8px; margin-bottom: 5px; }
  .td-swipe-panel {
    position: absolute; top: 0; bottom: 0; width: 56px;
    display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff;
  }
  .td-swipe-panel.edit { left: 0; background: var(--accent); }
  .td-swipe-panel.delete { right: 0; background: var(--danger); }
  .td-subtask-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-elevated); border-radius: 8px; padding: 7px 9px;
    position: relative; touch-action: pan-y;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .td-subtask-check {
    width: 19px; height: 19px; border-radius: 10px; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; color: var(--accent);
  }
  .td-subtask-check.done { border-color: var(--accent); background: var(--accent-soft); }
  .td-subtask-text { flex: 1; font-size: 13px; color: var(--text); word-break: break-word; }
  .td-subtask-text.done { text-decoration: line-through; color: var(--text-muted); }
  .td-subtask-edit-input {
    flex: 1; background: var(--surface); border: 1px solid var(--accent); border-radius: 6px;
    padding: 4px 7px; font-size: 16px; color: var(--text); outline: none;
  }
  .td-description { font-size: 13px; color: var(--text-secondary); line-height: 19px; white-space: pre-wrap; }
  .td-move-row { display: flex; gap: 8px; align-items: center; }
  .td-move-buttons { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; }
  .td-move-btn {
    padding: 7px 11px; border-radius: 8px; background: var(--surface-elevated);
    border: 1px solid var(--border); color: var(--text-secondary); font-size: 12px; font-weight: 600;
  }
  .td-move-cal-btn {
    width: 34px; height: 34px; border-radius: 8px; background: var(--surface-elevated);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }

  /* ---------- Confirm dialog ---------- */
  .confirm-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .confirm-btn {
    width: 100%; padding: 13px; border-radius: 12px;
    font-size: 14px; font-weight: 700; text-align: center;
  }
  .confirm-btn.neutral { background: var(--surface-elevated); color: var(--text-secondary); border: 1px solid var(--border); }
  .confirm-btn.danger { background: var(--danger); color: #fff; }

  /* ---------- Notes ---------- */
  .notes-container {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 8px 14px calc(14px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .notes-header { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-bottom: 5px; color: var(--text-muted); }
  .notes-header-left { display: flex; align-items: center; gap: 5px; }
  .notes-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px; }
  .notes-delete-all-btn {
    font-size: 10px; font-weight: 700; color: var(--danger);

  }
  .notes-textarea {
    width: 100%; height: 78px; resize: none;

    font-size: 16px; color: var(--text); line-height: 22px;
    transition: height .25s ease;
    overflow-y: hidden;
  }

  /* ---------- Modals ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 70px 16px 30px; overflow-y: auto; z-index: 50;
  }
  .modal-backdrop.hidden { display: none; }
  .modal-card {
    width: 100%; max-width: 400px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px;
  }
  .modal-card.sheet { max-width: 420px; }
  .modal-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 2px; }
  .modal-subtitle { font-size: 12px; color: var(--accent); font-weight: 600; margin: 0 0 14px; }
  .section-label {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.9px; margin: 0 0 8px;
  }
  .text-input {
    width: 100%; background: var(--surface-elevated); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 13px 14px; font-size: 16px; color: var(--text);
    outline: none; margin-bottom: 18px;
  }
  .text-input:focus { border-color: var(--accent); }
  .option-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .option-pill {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px; border-radius: 10px;
    background: var(--surface-elevated); border: 1.5px solid var(--border);
    font-size: 13px; font-weight: 600; color: var(--text-muted);
  }
  .option-pill.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .option-pill .dot { width: 9px; height: 9px; border-radius: 5px; flex-shrink: 0; }
  #recurrenceRow .option-pill { font-size: 12px; padding: 9px 3px; }
  .category-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .category-option {
    width: 22%; flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 4px; border-radius: 10px;
    background: var(--surface-elevated); border: 1.5px solid var(--border);
    font-size: 10px; font-weight: 600; color: var(--text-muted);
  }
  .category-option .em { font-size: 19px; }
  .category-option.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .subtask-editor { margin-bottom: 18px; }
  .subtask-row {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface-elevated); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 6px;
  }
  .subtask-check {
    width: 19px; height: 19px; border-radius: 10px; border: 1.5px solid var(--border);

  }
  .subtask-check.done { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .subtask-text { flex: 1; font-size: 13px; min-width: 0; word-break: break-word; }
  .subtask-text.done { text-decoration: line-through; color: var(--text-muted); }
  .subtask-remove { color: var(--text-muted); font-size: 14px; flex-shrink: 0; padding: 2px; }
  .subtask-input-row { display: flex; gap: 8px; margin-top: 2px; }
  .subtask-input-row .text-input { margin-bottom: 0; padding: 10px 12px; font-size: 16px; }
  .subtask-add-btn {
    width: 38px; height: 38px; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 18px; font-weight: 700; flex-shrink: 0;
  }
  .subtask-add-btn:disabled { background: var(--surface-elevated); color: var(--text-muted); }
  .modal-actions { display: flex; gap: 12px; margin-top: 4px; }
  .btn {
    flex: 1; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700; text-align: center;
  }
  .btn-cancel { background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-secondary); flex: 1; }
  .btn-save { background: var(--accent); color: #fff; flex: 2; }
  .btn-save:disabled { background: var(--surface-elevated); color: var(--text-muted); }
  .btn-danger-text { color: var(--danger); background: none; font-size: 13px; font-weight: 600; padding: 10px; width: 100%; text-align: center; margin-top: 4px; }

  /* month calendar modal */
  .month-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .month-label { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .month-nav { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 18px; border-radius: 8px; }
  .month-nav:hover { background: var(--surface-elevated); }
  .weekday-row { display: flex; margin-bottom: 6px; }
  .weekday-cell { flex: 1; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: .5px; }
  .weekday-cell.weekend { color: var(--accent); opacity: .7; }
  .week-row { display: flex; border-radius: 10px; margin-bottom: 2px; padding: 3px 0; }
  .week-row.current-week { background: var(--accent-soft); }
  .week-row:hover { background: var(--surface-elevated); }
  .week-row.selected { background: var(--accent-soft); }
  .cal-day-cell { flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; transition: transform .1s ease; }
  .cal-day-cell[data-pickday]:active { transform: scale(0.88); }
  .cal-day-inner { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--text-secondary); font-weight: 500; }
  .cal-day-inner.today { background: var(--today); color: #0F1117; font-weight: 700; }
  .cal-day-inner.selected { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-day-inner.other-month { color: var(--text-muted); opacity: .4; }
  .cal-day-inner.disabled { opacity: .2; }
  .cal-day-inner.preview { box-shadow: 0 0 0 2px rgba(245, 158, 11, .55); }
  .month-nav:disabled { cursor: default; }
  .month-label-chevron { font-size: 11px; opacity: .65; }
  .dp-weeks-viewport { overflow: hidden; }
  #dpMonthGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .month-grid-cell {
    padding: 14px 4px; border-radius: 10px; text-align: center;
    background: var(--surface-elevated); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; font-weight: 600;
  }
  .month-grid-cell.current { border-color: var(--today); }
  .month-grid-cell.disabled { opacity: .25; }

  /* stats modal */
  .stats-progress-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .stats-big { font-size: 30px; font-weight: 800; color: var(--accent); }
  .stats-label { font-size: 12px; color: var(--text-secondary); }
  .bar-track { height: 8px; border-radius: 4px; background: var(--surface-elevated); overflow: hidden; margin-bottom: 12px; }
  .bar-fill { height: 8px; border-radius: 4px; background: var(--accent); }
  .stats-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
  .cat-stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cat-stat-emoji { font-size: 14px; width: 18px; }
  .cat-stat-label { font-size: 12px; width: 62px; flex-shrink: 0; }
  .cat-bar-track { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-elevated); overflow: hidden; }
  .cat-bar-fill { height: 6px; border-radius: 3px; background: var(--accent); }
  .cat-stat-count { font-size: 11px; color: var(--text-muted); width: 36px; text-align: right; flex-shrink: 0; }
  .stats-empty { font-size: 13px; color: var(--text-muted); font-style: italic; text-align: center; padding: 24px 0; }

  .close-btn {
    margin-top: 14px; padding: 12px; border-radius: 12px; width: 100%;
    background: var(--surface-elevated); color: var(--text-secondary); font-size: 15px; font-weight: 600;
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--surface-elevated); border: 1px solid var(--border);
    color: var(--text); padding: 10px 18px; border-radius: 12px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 420px) {
    .modal-backdrop { padding: 20px 10px; align-items: center; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="header">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
      <span class="menu-avatar" id="menuAvatar"><span>👤</span></span>
      <span class="menu-btn-label">Menu</span>
    </button>
    <div class="header-center-group" id="headerCenterGroup">
      <button class="icon-btn today-btn" id="todayBtnLeft" style="display:none;">Today</button>
      <button class="icon-btn" id="prevWeekBtn" aria-label="Previous week">‹</button>
      <button class="header-center" id="headerCenterBtn" aria-label="Jump to a date">
        <div class="header-title">Weekly</div>
        <div class="header-week" id="weekLabel"></div>
      </button>
      <button class="icon-btn" id="nextWeekBtn" aria-label="Next week">›</button>
      <button class="icon-btn today-btn" id="todayBtnRight" style="display:none;">Today</button>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="sortBtn" aria-label="Toggle sort by priority">🔝</button>
    </div>
  </header>

  <div class="toolbar">
    <button class="filter-summary-btn" id="filterSummaryBtn" aria-label="Filter by category">All</button>
    <div class="toolbar-actions">
      <button class="icon-btn" id="statsBtn" aria-label="Week summary">📈</button>
      <button class="icon-btn" id="loadMoreWeekBtn" aria-label="Show next week too">📃</button>
      <button class="icon-btn" id="selectModeBtn" aria-label="Select tasks">☑️</button>
    </div>
  </div>

  <main class="day-list" id="dayList"></main>

  <div class="select-bar hidden" id="selectBar">
    <span id="selectCount">0 selected</span>
    <div class="select-bar-actions">
      <button class="select-bar-btn" id="selectMoveBtn">Move</button>
      <button class="select-bar-btn danger" id="selectDeleteBtn">Delete</button>
      <button class="select-bar-btn" id="selectCancelBtn">Cancel</button>
    </div>
  </div>

  <div class="notes-container">
    <div class="notes-header">
      <div class="notes-header-left"><span>✏️</span><span class="notes-label">Notes</span></div>
      <button class="notes-delete-all-btn hidden" id="notesDeleteAllBtn">Delete all</button>
    </div>
    <textarea class="notes-textarea" id="notesInput" maxlength="500" placeholder="Quick notes, reminders, ideas…"></textarea>
  </div>
</div>

<!-- Task add/edit modal -->
<div class="modal-backdrop hidden" id="taskModalBackdrop">
  <div class="modal-card sheet">
    <button class="modal-subtitle" id="taskModalDay" style="background:none;border:none;padding:0;display:flex;align-items:center;gap:4px;"></button>
    <h2 class="modal-title" id="taskModalTitle">New Task</h2>

    <input class="text-input" id="taskTitleInput" maxlength="120" placeholder="What do you need to do?" style="margin-top:14px;" />

    <p class="section-label">Priority</p>
    <div class="option-row" id="priorityRow">
      <button class="option-pill" data-priority="standard"><span class="dot" style="background:#F0F0FF"></span>Standard</button>
      <button class="option-pill" data-priority="high"><span class="dot" style="background:#EF4444"></span>High</button>
    </div>

    <p class="section-label">Category</p>
    <div class="category-grid" id="categoryGrid"></div>

    <p class="section-label">Checklist (optional)</p>
    <div class="subtask-editor">
      <div id="subtaskList"></div>
      <div class="subtask-input-row">
        <input class="text-input" id="subtaskInput" maxlength="80" placeholder="Add a checklist item…" />
        <button class="subtask-add-btn" id="subtaskAddBtn">+</button>
      </div>
    </div>

    <p class="section-label">Repeat</p>
    <div class="option-row" id="recurrenceRow">
      <button class="option-pill" data-recurrence="none">Never</button>
      <button class="option-pill" data-recurrence="daily">Daily</button>
      <button class="option-pill" data-recurrence="weekly">Weekly</button>
      <button class="option-pill" data-recurrence="monthly">Monthly</button>
    </div>

    <div id="recurrenceUntilWrap" style="display:none; margin-bottom:18px;">
      <p class="section-label">Repeat Until</p>
      <div style="display:flex; gap:8px;">
        <button class="text-input" id="recurrenceUntilBtn" style="flex:1; margin-bottom:0; text-align:left; display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
          <span id="recurrenceUntilLabel">No end date</span>
          <span>📅</span>
        </button>
        <button id="recurrenceUntilClear" class="mini-btn" style="display:none; width:44px; height:44px; border-radius:10px; background:var(--surface-elevated); border:1px solid var(--border); flex-shrink:0;" aria-label="Clear end date">✕</button>
      </div>
    </div>

    <p class="section-label">Description (optional)</p>
    <textarea class="text-input" id="taskDescInput" maxlength="1000" placeholder="Add more detail…" style="min-height:76px; resize:vertical; font-family:inherit;"></textarea>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="taskModalCancel">Cancel</button>
      <button class="btn btn-save" id="taskModalSave" disabled>Save</button>
    </div>
    <button class="btn-danger-text" id="taskModalDelete" style="display:none;">Delete task</button>
  </div>
</div>

<!-- Stats modal -->
<div class="modal-backdrop hidden" id="statsModalBackdrop">
  <div class="modal-card">
    <h2 class="modal-title">Week Summary</h2>
    <p class="modal-subtitle" id="statsWeekLabel"></p>
    <div id="statsContent"></div>
    <button class="close-btn" id="statsModalClose">Close</button>
  </div>
</div>

<!-- Day picker modal (used when moving a task to a different day) -->
<div class="modal-backdrop hidden" id="dayPickerModalBackdrop">
  <div class="modal-card">
    <!-- Day-of-month view -->
    <div id="dpDayView">
      <div class="month-header">
        <button class="month-nav" id="dpPrevMonth" aria-label="Previous month">‹</button>
        <button class="month-label" id="dpMonthLabel" style="background:none; border:none; cursor:pointer; padding:0; font-family:inherit; display:flex; align-items:center; gap:4px;"></button>
        <button class="month-nav" id="dpNextMonth" aria-label="Next month">›</button>
      </div>
      <div class="weekday-row" id="dpWeekdayRow"></div>
      <div class="dp-weeks-viewport">
        <div id="dpWeeks"></div>
      </div>
    </div>
    <!-- Month/year picker view -->
    <div id="dpMonthView" style="display:none;">
      <div class="month-header">
        <button class="month-nav" id="dpMonthViewPrevYear" aria-label="Previous year">‹</button>
        <div class="month-label" id="dpMonthViewYearLabel"></div>
        <button class="month-nav" id="dpMonthViewNextYear" aria-label="Next year">›</button>
      </div>
      <div id="dpMonthGrid"></div>
    </div>
    <button class="close-btn" id="dayPickerModalClose">Close</button>
  </div>
</div>

<!-- Side menu drawer -->
<div class="drawer-backdrop hidden" id="drawerBackdrop">
  <div class="drawer-panel" id="drawerPanel">
    <div class="drawer-content" id="drawerContent"></div>
  </div>
</div>

<!-- Avatar choice modal -->
<div class="modal-backdrop hidden" id="avatarChoiceModalBackdrop">
  <div class="modal-card" style="max-width:320px;">
    <h2 class="modal-title">Choose avatar</h2>
    <div id="avatarChoiceContent"></div>
    <button class="close-btn" id="avatarChoiceModalClose">Cancel</button>
  </div>
</div>

<!-- Category filter modal -->
<div class="modal-backdrop hidden" id="categoryFilterModalBackdrop">
  <div class="modal-card" style="max-width:340px;">
    <h2 class="modal-title">Filter by category</h2>
    <p class="modal-subtitle" style="color:var(--text-secondary); font-weight:400; margin-bottom:14px;">Pick any number of categories.</p>
    <div id="categoryFilterList"></div>
    <button class="close-btn" id="categoryFilterModalClose">Done</button>
  </div>
</div>

<!-- Bulk move modal (selection mode) -->
<div class="modal-backdrop hidden" id="bulkMoveModalBackdrop">
  <div class="modal-card" style="max-width:340px;">
    <h2 class="modal-title">Move selected tasks</h2>
    <p class="modal-subtitle" id="bulkMoveCount" style="color:var(--text-secondary); font-weight:400; margin-bottom:14px;"></p>
    <div class="td-move-buttons" style="margin-bottom:12px;">
      <button class="td-move-btn" data-bulk-move="nextday">Day</button>
      <button class="td-move-btn" data-bulk-move="weekend">Weekend</button>
      <button class="td-move-btn" data-bulk-move="week">Week</button>
    </div>
    <button class="td-move-cal-btn" id="bulkMoveCalBtn" style="width:100%; border-radius:10px; gap:6px;" aria-label="Pick a date">📅 Pick a date</button>
    <button class="close-btn" id="bulkMoveModalClose">Cancel</button>
  </div>
</div>

<!-- Confirm dialog (used for delete confirmation) -->
<div class="modal-backdrop hidden" id="confirmModalBackdrop">
  <div class="modal-card" style="max-width:340px;">
    <h2 class="modal-title" id="confirmTitle"></h2>
    <p class="modal-subtitle" id="confirmMessage" style="color:var(--text-secondary); font-weight:400; margin-bottom:16px;"></p>
    <div class="confirm-actions" id="confirmActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============================== Constants ============================== */
  var DAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var CATEGORIES = [
    { value: "sport", emoji: "💪", label: "Sport" },
    { value: "study", emoji: "🎓", label: "Study" },
    { value: "work", emoji: "💼", label: "Work" },
    { value: "home", emoji: "🏡", label: "Home" },
    { value: "finance", emoji: "💸", label: "Finance" },
    { value: "entertainment", emoji: "🕺", label: "Fun" },
    { value: "health", emoji: "🩺", label: "Health" },
    { value: "other", emoji: "✔️", label: "Other" },
  ];
  var CATEGORY_MAP = {};
  CATEGORIES.forEach(function (c) { CATEGORY_MAP[c.value] = c; });
  var PRIORITY_COLORS = { high: "#EF4444", standard: "#F0F0FF" };
  var STORAGE_KEY = "weekly_planner_tasks_web_v1";
  var NOTES_KEY = "weekly_planner_notes_web_v1";
  var PROFILE_KEY = "weekly_planner_profile_v1";
  var LIFETIME_KEY = "weekly_planner_lifetime_v1";

  var AVATAR_PRESETS = ["🐶", "🐱", "🦊", "🐼", "🐸", "🦁", "🐨", "🐧", "🦉", "🐢", "🦄", "🐙"];

  var THEMES = [
    { id: "default", name: "Indigo", accent: "#6366F1", today: "#F59E0B" },
    { id: "emerald", name: "Emerald", accent: "#10B981", today: "#F59E0B" },
    { id: "rose", name: "Rose", accent: "#F43F5E", today: "#FBBF24" },
    { id: "ocean", name: "Ocean", accent: "#0EA5E9", today: "#F59E0B" },
    { id: "violet", name: "Violet", accent: "#A855F7", today: "#F59E0B" },
    { id: "amber", name: "Amber", accent: "#F59E0B", today: "#EF4444" },
  ];

  var profile = { name: "", avatar: null, theme: "default" };
  var lifetime = { tasksCreated: 0, completedIds: [], hasRecurring: false, hasDescription: false };

  var BADGES = [
    { id: "first-task", emoji: "🌱", name: "Getting Started", desc: "Create your first task", check: function () { return lifetime.tasksCreated >= 1; } },
    { id: "ten-done", emoji: "✅", name: "Task Master", desc: "Complete 10 tasks", check: function () { return lifetime.completedIds.length >= 10; } },
    { id: "hundred-done", emoji: "🏆", name: "Century Club", desc: "Complete 100 tasks", check: function () { return lifetime.completedIds.length >= 100; } },
    { id: "fifty-created", emoji: "📝", name: "Planner Pro", desc: "Create 50 tasks", check: function () { return lifetime.tasksCreated >= 50; } },
    { id: "recurring", emoji: "🔁", name: "Creature of Habit", desc: "Create a recurring task", check: function () { return lifetime.hasRecurring; } },
    { id: "description", emoji: "📖", name: "Detail Oriented", desc: "Add a description to a task", check: function () { return lifetime.hasDescription; } },
  ];
  var RECUR_LABELS = { daily: "Daily", weekly: "Weekly", monthly: "Monthly" };

  function hexToRgba(hex, alpha) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }
  function applyTheme(themeId) {
    var t = THEMES.filter(function (x) { return x.id === themeId; })[0] || THEMES[0];
    var root = document.documentElement.style;
    root.setProperty("--accent", t.accent);
    root.setProperty("--today", t.today);
    root.setProperty("--accent-soft", hexToRgba(t.accent, 0.16));
    root.setProperty("--today-soft", hexToRgba(t.today, 0.10));
  }

  function loadProfile() {
    try {
      var raw = localStorage.getItem(PROFILE_KEY);
      if (raw) profile = Object.assign(profile, JSON.parse(raw));
    } catch (e) {}
    applyTheme(profile.theme);
  }
  function saveProfile() {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch (e) {}
  }
  function loadLifetime() {
    try {
      var raw = localStorage.getItem(LIFETIME_KEY);
      if (raw) lifetime = Object.assign(lifetime, JSON.parse(raw));
    } catch (e) {}
  }
  function saveLifetime() {
    try { localStorage.setItem(LIFETIME_KEY, JSON.stringify(lifetime)); } catch (e) {}
  }
  function trackTaskCreated(task) {
    lifetime.tasksCreated++;
    if (task.recurrence) lifetime.hasRecurring = true;
    if (task.description) lifetime.hasDescription = true;
    saveLifetime();
  }
  function trackTaskCompleted(taskId) {
    if (lifetime.completedIds.indexOf(taskId) === -1) {
      lifetime.completedIds.push(taskId);
      saveLifetime();
    }
  }

  /* ============================== State ============================== */
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var state = {
    weekOffset: 0,
    tasks: [],
    notes: "",
    sortByPriority: false,
    filterCategories: [], // empty = show all categories
    displayCache: [], // last computed list of real+virtual tasks, kept fresh every render
    expandedTaskId: null, // id of the task whose details panel is open, if any
    multiWeekMode: false, // when true, renders the current week + the next one in one scroll
    selectionMode: false,
    selectedTaskIds: [],
  };

  /* ============================== Date helpers ============================== */
  function pad(n) { return String(n).padStart(2, "0"); }
  function formatDayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function dateFromDayKey(key) {
    var parts = key.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function getWeekMonday(d) {
    var x = new Date(d);
    var day = x.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
  }
  function getWeekDays(monday) {
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }
    return days;
  }
  function isSameDay(a, b) { return formatDayKey(a) === formatDayKey(b); }
  function formatWeekLabel(monday) {
    var sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    if (monday.getMonth() === sunday.getMonth()) {
      return MONTH_SHORT[monday.getMonth()] + " " + monday.getDate() + " – " + sunday.getDate() + ", " + sunday.getFullYear();
    }
    return MONTH_SHORT[monday.getMonth()] + " " + monday.getDate() + " – " + MONTH_SHORT[sunday.getMonth()] + " " + sunday.getDate() + ", " + sunday.getFullYear();
  }
  function currentWeekDays() {
    var monday = getWeekMonday(new Date(today));
    monday.setDate(monday.getDate() + state.weekOffset * 7);
    return getWeekDays(monday);
  }

  // Returns the list of week-groups to render: just the current week
  // normally, or the current week plus the next one when "load next week"
  // (multiWeekMode) is toggled on.
  function visibleWeekGroups() {
    var groups = [currentWeekDays()];
    if (state.multiWeekMode) {
      var nextMonday = getWeekMonday(new Date(today));
      nextMonday.setDate(nextMonday.getDate() + (state.weekOffset + 1) * 7);
      groups.push(getWeekDays(nextMonday));
    }
    return groups;
  }

  /* ============================== Storage ============================== */
  function loadData() {
    try {
      var rawTasks = localStorage.getItem(STORAGE_KEY);
      state.tasks = rawTasks ? JSON.parse(rawTasks).map(migrateTask) : [];
    } catch (e) { state.tasks = []; }
    try {
      state.notes = localStorage.getItem(NOTES_KEY) || "";
    } catch (e) { state.notes = ""; }
  }
  function saveTasks(updated) {
    state.tasks = updated;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(updated)); } catch (e) {}
  }
  function saveNotes(text) {
    state.notes = text;
    try { localStorage.setItem(NOTES_KEY, text); } catch (e) {}
  }

  var isNotesExpanded = false;
  var NOTES_COLLAPSED_HEIGHT = 78;

  function expandNotes() {
    var ta = document.getElementById("notesInput");
    var deleteBtn = document.getElementById("notesDeleteAllBtn");
    var hasContent = ta.value && ta.value.trim().length > 0;
    if (!hasContent) {
      isNotesExpanded = false;
      ta.style.height = NOTES_COLLAPSED_HEIGHT + "px";
      ta.style.overflowY = "hidden";
      deleteBtn.classList.add("hidden");
      return;
    }
    isNotesExpanded = true;
    deleteBtn.classList.remove("hidden");
    var appHeightRaw = getComputedStyle(document.documentElement).getPropertyValue("--app-height");
    var appHeight = parseFloat(appHeightRaw) || window.innerHeight;
    var maxHeight = Math.floor(appHeight / 3);
    var prevHeight = ta.style.height || NOTES_COLLAPSED_HEIGHT + "px";
    ta.style.transition = "none";
    ta.style.height = "auto";
    var natural = ta.scrollHeight;
    ta.style.height = prevHeight;
    void ta.offsetHeight; // force reflow so the next height change actually animates
    ta.style.transition = "height .25s ease";
    var target = Math.min(Math.max(natural, NOTES_COLLAPSED_HEIGHT), maxHeight);
    ta.style.height = target + "px";
    ta.style.overflowY = natural > maxHeight ? "auto" : "hidden";
  }

  function collapseNotes() {
    isNotesExpanded = false;
    var ta = document.getElementById("notesInput");
    ta.style.transition = "height .25s ease";
    ta.style.height = NOTES_COLLAPSED_HEIGHT + "px";
    ta.style.overflowY = "hidden";
    document.getElementById("notesDeleteAllBtn").classList.add("hidden");
  }

  function requestDeleteAllNotes() {
    showConfirm({
      title: "Delete all notes?",
      message: "This can't be undone.",
      buttons: [
        { label: "Cancel", variant: "neutral", isCancel: true },
        {
          label: "Delete", variant: "danger", onPress: function () {
            var ta = document.getElementById("notesInput");
            ta.value = "";
            saveNotes("");
            collapseNotes();
          }
        },
      ],
    });
  }

  function migrateTask(t, idx) {
    return {
      id: t.id,
      title: t.title,
      dayKey: t.dayKey,
      completed: t.completed || false,
      priority: t.priority === "high" ? "high" : "standard",
      category: CATEGORY_MAP[t.category] ? t.category : "other",
      createdAt: t.createdAt || Date.now() + idx,
      order: typeof t.order === "number" ? t.order : idx,
      subtasks: Array.isArray(t.subtasks) ? t.subtasks : undefined,
      recurrence: (t.recurrence === "daily" || t.recurrence === "weekly" || t.recurrence === "monthly") ? t.recurrence : undefined,
      recurrenceId: t.recurrenceId || undefined,
      recurrenceUntil: t.recurrenceUntil || undefined,
      description: t.description || undefined,
      skipped: !!t.skipped,
    };
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

  /* ============================== Recurrence engine ============================== */
  function isMonthlyMatch(day, startDate) {
    // Clamp to the last day of the month for months shorter than the
    // start day (e.g. a task created on the 31st recurs on Feb 28/29,
    // Apr 30, etc. instead of being skipped entirely).
    var lastDayOfMonth = new Date(day.getFullYear(), day.getMonth() + 1, 0).getDate();
    var targetDom = Math.min(startDate.getDate(), lastDayOfMonth);
    return day.getDate() === targetDom;
  }

  function generateRecurringInstances(allTasks, weekDays) {
    var templates = allTasks.filter(function (t) { return t.recurrence && !t.skipped; });
    if (templates.length === 0) return [];
    var instances = [];
    templates.forEach(function (template) {
      var startDate = dateFromDayKey(template.dayKey);
      startDate.setHours(0, 0, 0, 0);
      var untilDate = template.recurrenceUntil ? dateFromDayKey(template.recurrenceUntil) : null;
      if (untilDate) untilDate.setHours(0, 0, 0, 0);
      weekDays.forEach(function (day) {
        var d = new Date(day); d.setHours(0, 0, 0, 0);
        var dayKey = formatDayKey(d);
        if (d.getTime() < startDate.getTime()) return;
        if (untilDate && d.getTime() > untilDate.getTime()) return;
        if (dayKey === template.dayKey) return;
        var matches = template.recurrence === "daily" ||
          (template.recurrence === "weekly" && d.getDay() === startDate.getDay()) ||
          (template.recurrence === "monthly" && isMonthlyMatch(d, startDate));
        if (!matches) return;
        var already = allTasks.some(function (t) { return t.recurrenceId === template.id && t.dayKey === dayKey; });
        if (already) return;
        instances.push(Object.assign({}, template, {
          id: template.id + "::" + dayKey,
          dayKey: dayKey,
          completed: false,
          recurrence: undefined,
          recurrenceId: template.id,
          skipped: false,
          subtasks: template.subtasks ? template.subtasks.map(function (s) { return Object.assign({}, s, { completed: false }); }) : undefined,
        }));
      });
    });
    return instances;
  }

  function computeDisplayTasks() {
    var allWeekDays = [];
    visibleWeekGroups().forEach(function (wd) { allWeekDays = allWeekDays.concat(wd); });
    var virtual = generateRecurringInstances(state.tasks, allWeekDays);
    var real = state.tasks.filter(function (t) { return !t.skipped; });
    state.displayCache = real.concat(virtual);
    return state.displayCache;
  }

  function materializeIfNeeded(id) {
    var existing = state.tasks.find(function (t) { return t.id === id; });
    if (existing) return state.tasks;
    var virtual = state.displayCache.find(function (t) { return t.id === id; });
    if (!virtual) return state.tasks;
    var updated = state.tasks.concat([virtual]);
    saveTasks(updated);
    return updated;
  }

  /* ============================== Task actions ============================== */
  function toggleTask(id) {
    var list = materializeIfNeeded(id);
    var target = list.find(function (t) { return t.id === id; });
    var updated = list.map(function (t) { return t.id === id ? Object.assign({}, t, { completed: !t.completed }) : t; });
    if (target && !target.completed) trackTaskCompleted(id);
    saveTasks(updated);
    render();
  }
  function deleteTask(id) {
    var list = materializeIfNeeded(id);
    var target = list.find(function (t) { return t.id === id; });
    if (!target) { render(); return; }
    // Any occurrence that belongs to a recurring series but isn't the
    // template itself must be tombstoned (not hard-deleted), regardless of
    // whether it happens to already be materialized (e.g. because opening
    // the edit sheet materializes it first) - otherwise the recurrence
    // engine sees no record for that day and instantly regenerates it.
    var isRecurringInstance = !!target.recurrenceId && target.recurrenceId !== target.id;
    if (isRecurringInstance) {
      saveTasks(list.map(function (t) { return t.id === id ? Object.assign({}, t, { skipped: true }) : t; }));
    } else {
      saveTasks(list.filter(function (t) { return t.id !== id; }));
    }
    render();
  }
  function moveTask(id, direction) {
    // Reorders within the task's own day, only meaningful when not
    // priority-sorted and no category filter is hiding sibling tasks.
    var list = materializeIfNeeded(id);
    var task = list.find(function (t) { return t.id === id; });
    if (!task) return;
    var dayTasks = list.filter(function (t) { return t.dayKey === task.dayKey; })
      .sort(function (a, b) { return a.order - b.order || a.createdAt - b.createdAt; });
    var idx = dayTasks.findIndex(function (t) { return t.id === id; });
    var swapIdx = idx + direction;
    if (swapIdx < 0 || swapIdx >= dayTasks.length) return;
    var tmp = dayTasks[idx].order;
    dayTasks[idx] = Object.assign({}, dayTasks[idx], { order: dayTasks[swapIdx].order });
    dayTasks[swapIdx] = Object.assign({}, dayTasks[swapIdx], { order: tmp });
    var others = list.filter(function (t) { return t.dayKey !== task.dayKey; });
    var merged = others.concat(dayTasks);
    saveTasks(merged);
    render();
  }

  /* ============================== Rendering: header/toolbar ============================== */
  function renderHeader() {
    var weekDays = currentWeekDays();
    var monday = weekDays[0];
    document.getElementById("weekLabel").textContent = formatWeekLabel(monday);
    // Today sits on whichever side points back toward the present: to the
    // right of the right arrow when browsing a past week (press → to get
    // back), to the left of the left arrow when browsing a future week
    // (press ← to get back). Hidden entirely on the current week.
    var todayLeft = document.getElementById("todayBtnLeft");
    var todayRight = document.getElementById("todayBtnRight");
    todayLeft.style.display = state.weekOffset > 0 ? "flex" : "none";
    todayRight.style.display = state.weekOffset < 0 ? "flex" : "none";
    document.getElementById("sortBtn").classList.toggle("active", state.sortByPriority);
  }

  function updateMenuAvatar() {
    var el = document.getElementById("menuAvatar");
    if (!el) return;
    el.innerHTML = renderAvatarInner();
  }

  function renderFilterChips() {
    var btn = document.getElementById("filterSummaryBtn");
    var cats = state.filterCategories;
    if (cats.length === 0) {
      btn.textContent = "All";
      btn.classList.remove("has-selection");
    } else if (cats.length <= 3) {
      var emojis = cats.map(function (v) { return (CATEGORY_MAP[v] || {}).emoji || ""; }).join(" ");
      btn.textContent = emojis;
      btn.classList.add("has-selection");
    } else {
      // 4+ selected: show the first two (in the order they were picked)
      // plus a "+N" count for the rest, so the button never grows wide.
      var firstTwo = cats.slice(0, 2).map(function (v) { return (CATEGORY_MAP[v] || {}).emoji || ""; }).join(" ");
      btn.textContent = firstTwo + " +" + (cats.length - 2);
      btn.classList.add("has-selection");
    }
  }

  function openCategoryFilterModal() {
    renderCategoryFilterList();
    document.getElementById("categoryFilterModalBackdrop").classList.remove("hidden");
  }
  function closeCategoryFilterModal() {
    document.getElementById("categoryFilterModalBackdrop").classList.add("hidden");
  }
  function renderCategoryFilterList() {
    var list = document.getElementById("categoryFilterList");
    var allActive = state.filterCategories.length === 0;
    var html = '<button class="category-filter-row' + (allActive ? " active" : "") + '" data-filter-all>' +
      '<span class="cf-emoji">🗂️</span><span class="cf-label">All categories</span>' +
      '<span class="cf-check' + (allActive ? " done" : "") + '">' + (allActive ? "✓" : "") + "</span></button>";
    CATEGORIES.forEach(function (c) {
      var active = state.filterCategories.indexOf(c.value) !== -1;
      html += '<button class="category-filter-row' + (active ? " active" : "") + '" data-filter-cat="' + c.value + '">' +
        '<span class="cf-emoji">' + c.emoji + '</span><span class="cf-label">' + c.label + '</span>' +
        '<span class="cf-check' + (active ? " done" : "") + '">' + (active ? "✓" : "") + "</span></button>";
    });
    list.innerHTML = html;
    var allBtn = list.querySelector("[data-filter-all]");
    allBtn.addEventListener("click", function () {
      state.filterCategories = [];
      renderCategoryFilterList();
      renderFilterChips();
      renderDayList();
    });
    list.querySelectorAll("[data-filter-cat]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var val = btn.getAttribute("data-filter-cat");
        var idx = state.filterCategories.indexOf(val);
        if (idx !== -1) state.filterCategories.splice(idx, 1);
        else state.filterCategories.push(val);
        renderCategoryFilterList();
        renderFilterChips();
        renderDayList();
      });
    });
  }

  /* ============================== Rendering: day list ============================== */
  function renderDayList() {
    var container = document.getElementById("dayList");
    var weekGroups = visibleWeekGroups();
    var allTasks = computeDisplayTasks();
    var html = "";

    weekGroups.forEach(function (weekDays, groupIndex) {
      if (groupIndex > 0) {
        html += '<div class="week-divider"><span>' + formatWeekLabel(weekDays[0]) + '</span></div>';
      }
      weekDays.forEach(function (date) {
      var dayKey = formatDayKey(date);
      var dayIndex = date.getDay() === 0 ? 6 : date.getDay() - 1;
      var isWeekend = dayIndex >= 5;
      var isToday = isSameDay(date, today) && groupIndex === 0 && state.weekOffset === 0;

      var dayTasksAll = allTasks.filter(function (t) { return t.dayKey === dayKey; });
      var dayTasks = state.filterCategories.length ? dayTasksAll.filter(function (t) { return state.filterCategories.indexOf(t.category) !== -1; }) : dayTasksAll;

      var sorted = dayTasks.slice();
      var incomplete = sorted.filter(function (t) { return !t.completed; });
      var complete = sorted.filter(function (t) { return t.completed; });
      if (state.sortByPriority) {
        var pw = { high: 0, standard: 1 };
        incomplete.sort(function (a, b) { return pw[a.priority] - pw[b.priority] || a.createdAt - b.createdAt; });
        complete.sort(function (a, b) { return a.createdAt - b.createdAt; });
      } else {
        incomplete.sort(function (a, b) { return a.order - b.order || a.createdAt - b.createdAt; });
        complete.sort(function (a, b) { return a.order - b.order || a.createdAt - b.createdAt; });
      }
      var ordered = incomplete.concat(complete);
      var canReorder = !state.sortByPriority && state.filterCategories.length === 0;

      html += '<section class="day-section' + (isToday ? " today" : "") + '" data-daykey="' + dayKey + '">';
      html += '<div class="day-header-row"><div class="day-header-left">';
      html += '<div class="date-circle' + (isToday ? " today" : "") + '">' + date.getDate() + '</div>';
      html += '<span class="day-label' + (isWeekend ? " weekend" : "") + (isToday ? " today" : "") + '">' + DAY_LABELS[dayIndex] + '</span>';
      if (dayTasks.length > 0) html += '<span class="task-badge">' + dayTasks.length + '</span>';
      html += '</div>';
      html += '<button class="add-btn" data-add="' + dayKey + '">+</button>';
      html += '</div>';

      if (ordered.length > 0) {
        html += '<div class="task-list">';
        var taskNumber = 0;
        ordered.forEach(function (t) {
          if (!t.completed) taskNumber++;
          html += renderTaskRow(t, t.completed ? null : taskNumber, canReorder);
        });
        html += '</div>';
      } else {
        html += '<button class="empty-row" data-add="' + dayKey + '" style="width:100%;text-align:left;"><span class="empty-text">Tap to add a task</span></button>';
      }
      html += '</section>';
      });
    });

    container.innerHTML = html;

    container.querySelectorAll("[data-add]").forEach(function (el) {
      el.addEventListener("click", function () { openTaskModal(null, el.getAttribute("data-add")); });
    });
    container.querySelectorAll("[data-toggle]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); toggleTask(el.getAttribute("data-toggle")); });
    });
    container.querySelectorAll("[data-move-up]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); moveTask(el.getAttribute("data-move-up"), -1); });
    });
    container.querySelectorAll("[data-move-down]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); moveTask(el.getAttribute("data-move-down"), 1); });
    });
    container.querySelectorAll("[data-details-toggle]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        var id = el.getAttribute("data-details-toggle");
        if (state.selectionMode) { e.stopPropagation(); toggleTaskSelection(id); return; }
        toggleTaskDetails(id);
      });
    });
    attachSwipeHandlers(container);

    // A full re-render (e.g. after any task mutation) rebuilds every row
    // from scratch, so if a task's details panel was open, restore it
    // instantly (no animation - this isn't a fresh user-initiated expand).
    if (state.expandedTaskId) {
      var stillVisible = document.getElementById("details-" + state.expandedTaskId);
      if (stillVisible) {
        expandDetails(state.expandedTaskId, false);
      } else {
        state.expandedTaskId = null;
      }
    }
  }

  function renderTaskRow(t, taskNumber, canReorder) {
    var catInfo = CATEGORY_MAP[t.category] || CATEGORY_MAP.other;
    var color = PRIORITY_COLORS[t.priority] || PRIORITY_COLORS.standard;
    var selectionMode = state.selectionMode;
    var isSelected = state.selectedTaskIds.indexOf(t.id) !== -1;
    var html = '<div class="task-row-outer">';
    if (!selectionMode) {
      html += '<div class="swipe-panel edit" data-swipe-edit="' + t.id + '">✏️</div>';
      html += '<div class="swipe-panel delete" data-swipe-delete="' + t.id + '">🗑️</div>';
    }
    html += '<div class="task-row' + (t.completed ? " completed" : "") + (selectionMode ? " selectable" : "") + '" data-swipe-id="' + t.id + '"' + (selectionMode ? ' data-select-row="' + t.id + '"' : '') + '>';
    if (selectionMode) {
      html += '<span class="select-check' + (isSelected ? " done" : "") + '">' + (isSelected ? "✓" : "") + '</span>';
    }
    html += '<div class="priority-bar" style="background:' + color + '"></div>';
    if (taskNumber) html += '<span class="task-number">' + taskNumber + '.</span>';
    html += '<span class="task-emoji">' + catInfo.emoji + '</span>';
    if (t.recurrenceId) html += '<span class="recurrence-icon">🔁</span>';
    html += '<button class="task-title" data-details-toggle="' + t.id + '">' + escapeHtml(t.title) + '</button>';
    if (t.description) html += '<span class="desc-badge" title="Has a description">ⓘ</span>';
    if (t.subtasks && t.subtasks.length) {
      var done = t.subtasks.filter(function (s) { return s.completed; }).length;
      html += '<span class="subtask-badge">☑ ' + done + '/' + t.subtasks.length + '</span>';
    }
    if (canReorder && !selectionMode) {
      html += '<div class="task-actions">';
      html += '<button class="mini-btn" data-move-up="' + t.id + '" aria-label="Move up">▲</button>';
      html += '<button class="mini-btn" data-move-down="' + t.id + '" aria-label="Move down">▼</button>';
      html += '</div>';
    }
    if (!selectionMode) {
      html += '<button class="check-btn" data-toggle="' + t.id + '" style="' + (t.completed ? ("border-color:" + color + ";background:" + color + "25;") : "") + '" aria-label="Mark as done">' + (t.completed ? "✓" : "") + '</button>';
    }
    html += '</div>'; // .task-row
    html += '</div>'; // .task-row-outer
    html += '<div class="task-details" id="details-' + t.id + '" style="max-height:0; overflow:hidden;"></div>';
    return html;
  }

  /* ============================== Swipe engine (edit / delete reveal) ============================== */
  var SWIPE_W = 72;

  function attachSwipeHandlers(container) {
    container.querySelectorAll(".task-row[data-swipe-id]").forEach(function (rowEl) {
      var id = rowEl.getAttribute("data-swipe-id");
      var outer = rowEl.closest(".task-row-outer");

      if (rowEl.hasAttribute("data-select-row")) {
        // Selection mode: no swipe gestures, the whole row just toggles selection.
        rowEl.addEventListener("click", function (e) {
          if (e.target.closest(".check-btn, .mini-btn")) return;
          toggleTaskSelection(id);
        });
        return;
      }

      var revealed = "none"; // "none" | "edit" | "delete"
      var mode = "idle"; // "idle" | "swipe"
      var startX = 0, startY = 0, baseX = 0;

      function setX(px, animate) {
        rowEl.style.transition = animate ? "transform .18s ease" : "none";
        rowEl.style.transform = "translateX(" + px + "px)";
      }
      function snap(side) {
        revealed = side;
        var target = side === "delete" ? -SWIPE_W : side === "edit" ? SWIPE_W : 0;
        setX(target, true);
      }

      rowEl.addEventListener("pointerdown", function (e) {
        if (e.target.closest(".check-btn, .mini-btn, .task-title")) return;
        mode = "idle";
        startX = e.clientX;
        startY = e.clientY;
        baseX = revealed === "delete" ? -SWIPE_W : revealed === "edit" ? SWIPE_W : 0;
        try { rowEl.setPointerCapture(e.pointerId); } catch (err) {}
      });
      rowEl.addEventListener("pointermove", function (e) {
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (mode === "idle") {
          if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) mode = "swipe";
          else return;
        }
        var next = Math.max(-SWIPE_W, Math.min(SWIPE_W, baseX + dx));
        setX(next, false);
      });
      function endSwipe(e) {
        if (mode === "swipe") {
          var dx = e.clientX - startX;
          var finalX = Math.max(-SWIPE_W, Math.min(SWIPE_W, baseX + dx));
          if (finalX <= -SWIPE_W / 2) snap("delete");
          else if (finalX >= SWIPE_W / 2) snap("edit");
          else snap("none");
        } else if (revealed !== "none") {
          snap("none");
        }
        mode = "idle";
      }
      rowEl.addEventListener("pointerup", endSwipe);
      rowEl.addEventListener("pointercancel", function () { mode = "idle"; snap("none"); });

      var editBtn = outer.querySelector("[data-swipe-edit]");
      var deleteBtn = outer.querySelector("[data-swipe-delete]");
      editBtn.addEventListener("click", function () {
        snap("none");
        openTaskModal(id);

      });

  var TD_SWIPE_W = 56;

  function attachTdSubtaskSwipe(rowEl) {
    var outer = rowEl.closest(".td-subtask-outer");
    var revealed = "none";
    var mode = "idle";
    var startX = 0, startY = 0, baseX = 0;

    function setX(px, animate) {
      rowEl.style.transition = animate ? "transform .16s ease" : "none";
      rowEl.style.transform = "translateX(" + px + "px)";
    }
    function snap(side) {
      revealed = side;
      var target = side === "delete" ? -TD_SWIPE_W : side === "edit" ? TD_SWIPE_W : 0;
      setX(target, true);
    }

    rowEl.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".td-subtask-check")) return;
      mode = "idle";
      startX = e.clientX; startY = e.clientY;
      baseX = revealed === "delete" ? -TD_SWIPE_W : revealed === "edit" ? TD_SWIPE_W : 0;
      try { rowEl.setPointerCapture(e.pointerId); } catch (err) {}
    });
    rowEl.addEventListener("pointermove", function (e) {
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (mode === "idle") {
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) mode = "swipe";
        else return;
      }
      var next = Math.max(-TD_SWIPE_W, Math.min(TD_SWIPE_W, baseX + dx));
      setX(next, false);
    });
    function endSwipe(e) {
      if (mode === "swipe") {
        var dx = e.clientX - startX;
        var finalX = Math.max(-TD_SWIPE_W, Math.min(TD_SWIPE_W, baseX + dx));
        if (finalX <= -TD_SWIPE_W / 2) snap("delete");
        else if (finalX >= TD_SWIPE_W / 2) snap("edit");
        else snap("none");
      } else if (revealed !== "none") {
        snap("none");
      }
      mode = "idle";
    }
    rowEl.addEventListener("pointerup", endSwipe);
    rowEl.addEventListener("pointercancel", function () { mode = "idle"; snap("none"); });
  }

  function startSubtaskInlineEdit(taskId, subId, containerEl) {
    var rowEl = containerEl.querySelector('[data-td-sub-swipe="' + subId + '"]');
    if (!rowEl) return;
    rowEl.style.transition = "transform .16s ease";
    rowEl.style.transform = "translateX(0px)";
    var labelEl = rowEl.querySelector('[data-td-sub-label="' + subId + '"]');
    if (!labelEl) return;
    var currentText = labelEl.textContent;
    var input = document.createElement("input");
    input.type = "text";
    input.className = "td-subtask-edit-input";
    input.value = currentText;
    input.maxLength = 80;
    labelEl.replaceWith(input);
    input.focus();
    input.select();
    var committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      var newTitle = input.value.trim();
      if (newTitle && newTitle !== currentText) {
        updateSubtaskTitle(taskId, subId, newTitle);
      } else if (state.expandedTaskId === taskId) {
        expandDetails(taskId, false);
      }
    }
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { input.value = currentText; input.blur(); }
    });
  }

  function nextWeekdayAfter(fromDate, targetDow) {
    var d = new Date(fromDate);
    d.setDate(d.getDate() + 1);
    while (d.getDay() !== targetDow) d.setDate(d.getDate() + 1);
    return d;
  }

  function quickMoveTask(taskId, action, skipRender) {
    var t = findTaskAnywhere(taskId);
    if (!t) return;
    var base = dateFromDayKey(t.dayKey);
    base.setHours(0, 0, 0, 0);
    var target;
    if (action === "nextday") {
      target = new Date(base); target.setDate(target.getDate() + 1);
    } else if (action === "weekend") {
      target = nextWeekdayAfter(base, 6); // nearest Saturday
    } else if (action === "week") {
      target = nextWeekdayAfter(base, 1); // next Monday
    } else {
      return;
    }
    moveTaskToDay(taskId, formatDayKey(target), skipRender);
  }

  function moveTaskToDay(taskId, targetDayKey, skipRender) {
    var list = materializeIfNeeded(taskId);
    var targetTask = list.find(function (t) { return t.id === taskId; });
    if (!targetTask) return;
    var newOrder = list
      .filter(function (t) { return t.dayKey === targetDayKey && t.id !== taskId; })
      .reduce(function (m, t) { return Math.max(m, t.order); }, -1) + 1;
    var updated = list.map(function (t) {
      return t.id === taskId ? Object.assign({}, t, { dayKey: targetDayKey, order: newOrder }) : t;
    });
    state.expandedTaskId = null;
    saveTasks(updated);
    if (!skipRender) render();
  }

  function resizeImageDataUrl(dataUrl, maxSize, callback) {
    var img = new Image();
    img.onload = function () {
      // Center-crop to the largest possible square first, then scale that
      // square down - this bakes in a properly centered, non-distorted
      // crop so every place the avatar is shown (any size) looks right,
      // instead of relying on object-fit to crop a non-square source.
      var side = Math.min(img.width, img.height);
      var sx = (img.width - side) / 2;
      var sy = (img.height - side) / 2;
      var outSize = Math.min(maxSize, side);
      var canvas = document.createElement("canvas");
      canvas.width = outSize; canvas.height = outSize;
      var ctx = canvas.getContext("2d");
      if (!ctx) { callback(dataUrl); return; }
      ctx.drawImage(img, sx, sy, side, side, 0, 0, outSize, outSize);
      try { callback(canvas.toDataURL("image/jpeg", 0.85)); }
      catch (e) { callback(dataUrl); }
    };
    img.onerror = function () { callback(null); };
    img.src = dataUrl;
  }

  function computeTasksTabData() {
    var todayKey = formatDayKey(today);
    var overdue = state.tasks
      .filter(function (t) { return !t.completed && !t.skipped && !t.recurrenceId && t.dayKey <= todayKey; })
      .sort(function (a, b) { return a.dayKey < b.dayKey ? -1 : a.dayKey > b.dayKey ? 1 : 0; });

    var upcomingNonRecurring = state.tasks.filter(function (t) {
      return !t.completed && !t.skipped && !t.recurrenceId && t.dayKey > todayKey;
    });

    var templates = state.tasks.filter(function (t) { return t.recurrence && !t.skipped; });
    var upcomingRecurring = [];
    templates.forEach(function (tpl) {
      var candidateDayKey = null;
      if (tpl.dayKey >= todayKey) {
        candidateDayKey = tpl.dayKey;
      } else {
        var startDate = dateFromDayKey(tpl.dayKey);
        var untilDate = tpl.recurrenceUntil ? dateFromDayKey(tpl.recurrenceUntil) : null;
        var d = new Date(today);
        for (var i = 0; i < 366; i++) {
          if (untilDate && d.getTime() > untilDate.getTime()) break;
          var matches = tpl.recurrence === "daily" ||
            (tpl.recurrence === "weekly" && d.getDay() === startDate.getDay()) ||
            (tpl.recurrence === "monthly" && isMonthlyMatch(d, startDate));
          if (matches) { candidateDayKey = formatDayKey(d); break; }
          d.setDate(d.getDate() + 1);
        }
      }
      if (candidateDayKey) {
        upcomingRecurring.push(Object.assign({}, tpl, { dayKey: candidateDayKey }));
      }
    });

    var upcoming = upcomingNonRecurring.concat(upcomingRecurring)
      .sort(function (a, b) { return a.dayKey < b.dayKey ? -1 : a.dayKey > b.dayKey ? 1 : 0; });

    return { overdue: overdue, upcoming: upcoming };
  }
