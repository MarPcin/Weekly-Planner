<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============================== Constants ============================== */
  var DAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var CATEGORIES = [
    { value: "sport", emoji: "💪", label: "Sport" },
    { value: "study", emoji: "🎓", label: "Study" },
    { value: "work", emoji: "💼", label: "Work" },
    { value: "home", emoji: "🏡", label: "Home" },
    { value: "finance", emoji: "💸", label: "Finance" },
    { value: "entertainment", emoji: "🕺", label: "Fun" },
    { value: "health", emoji: "🩺", label: "Health" },
    { value: "other", emoji: "☑️", label: "Other" },
  ];
  var CATEGORY_MAP = {};
  CATEGORIES.forEach(function (c) { CATEGORY_MAP[c.value] = c; });
  var PRIORITY_COLORS = { high: "#EF4444", standard: "#F0F0FF" };
  var STORAGE_KEY = "weekly_planner_tasks_web_v1";
  var NOTES_KEY = "weekly_planner_notes_web_v1";

  /* ============================== State ============================== */
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var state = {
    weekOffset: 0,
    tasks: [],
    notes: "",
    sortByPriority: false,
    filterCategory: null,
    displayCache: [], // last computed list of real+virtual tasks, kept fresh every render
    expandedTaskId: null, // id of the task whose details panel is open, if any
  };

  /* ============================== Date helpers ============================== */
  function pad(n) { return String(n).padStart(2, "0"); }
  function formatDayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function dateFromDayKey(key) {
    var parts = key.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function getWeekMonday(d) {
    var x = new Date(d);
    var day = x.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    x.setHours(0, 0, 0, 0);
    return x;
  }
  function getWeekDays(monday) {
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }
    return days;
  }
  function isSameDay(a, b) { return formatDayKey(a) === formatDayKey(b); }
  function formatWeekLabel(monday) {
    var sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    if (monday.getMonth() === sunday.getMonth()) {
      return MONTH_SHORT[monday.getMonth()] + " " + monday.getDate() + " – " + sunday.getDate() + ", " + sunday.getFullYear();
    }
    return MONTH_SHORT[monday.getMonth()] + " " + monday.getDate() + " – " + MONTH_SHORT[sunday.getMonth()] + " " + sunday.getDate() + ", " + sunday.getFullYear();
  }
  function currentWeekDays() {
    var monday = getWeekMonday(new Date(today));
    monday.setDate(monday.getDate() + state.weekOffset * 7);
    return getWeekDays(monday);
  }

  /* ============================== Storage ============================== */
  function loadData() {
    try {
      var rawTasks = localStorage.getItem(STORAGE_KEY);
      state.tasks = rawTasks ? JSON.parse(rawTasks).map(migrateTask) : [];
    } catch (e) { state.tasks = []; }
    try {
      state.notes = localStorage.getItem(NOTES_KEY) || "";
    } catch (e) { state.notes = ""; }
  }
  function saveTasks(updated) {
    state.tasks = updated;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(updated)); } catch (e) {}
  }
  function saveNotes(text) {
    state.notes = text;
    try { localStorage.setItem(NOTES_KEY, text); } catch (e) {}
  }
  function migrateTask(t, idx) {
    return {
      id: t.id,
      title: t.title,
      dayKey: t.dayKey,
      completed: t.completed || false,
      priority: t.priority === "high" ? "high" : "standard",
      category: CATEGORY_MAP[t.category] ? t.category : "other",
      createdAt: t.createdAt || Date.now() + idx,
      order: typeof t.order === "number" ? t.order : idx,
      subtasks: Array.isArray(t.subtasks) ? t.subtasks : undefined,
      recurrence: (t.recurrence === "daily" || t.recurrence === "weekly" || t.recurrence === "monthly") ? t.recurrence : undefined,
      recurrenceId: t.recurrenceId || undefined,
      recurrenceUntil: t.recurrenceUntil || undefined,
      description: t.description || undefined,
      skipped: !!t.skipped,
    };
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

  /* ============================== Recurrence engine ============================== */
  function isMonthlyMatch(day, startDate) {
    // Clamp to the last day of the month for months shorter than the
    // start day (e.g. a task created on the 31st recurs on Feb 28/29,
    // Apr 30, etc. instead of being skipped entirely).
    var lastDayOfMonth = new Date(day.getFullYear(), day.getMonth() + 1, 0).getDate();
    var targetDom = Math.min(startDate.getDate(), lastDayOfMonth);
    return day.getDate() === targetDom;
  }

  function generateRecurringInstances(allTasks, weekDays) {
    var templates = allTasks.filter(function (t) { return t.recurrence && !t.skipped; });
    if (templates.length === 0) return [];
    var instances = [];
    templates.forEach(function (template) {
      var startDate = dateFromDayKey(template.dayKey);
      startDate.setHours(0, 0, 0, 0);
      var untilDate = template.recurrenceUntil ? dateFromDayKey(template.recurrenceUntil) : null;
      if (untilDate) untilDate.setHours(0, 0, 0, 0);
      weekDays.forEach(function (day) {
        var d = new Date(day); d.setHours(0, 0, 0, 0);
        var dayKey = formatDayKey(d);
        if (d.getTime() < startDate.getTime()) return;
        if (untilDate && d.getTime() > untilDate.getTime()) return;
        if (dayKey === template.dayKey) return;
        var matches = template.recurrence === "daily" ||
          (template.recurrence === "weekly" && d.getDay() === startDate.getDay()) ||
          (template.recurrence === "monthly" && isMonthlyMatch(d, startDate));
        if (!matches) return;
        var already = allTasks.some(function (t) { return t.recurrenceId === template.id && t.dayKey === dayKey; });
        if (already) return;
        instances.push(Object.assign({}, template, {
          id: template.id + "::" + dayKey,
          dayKey: dayKey,
          completed: false,
          recurrence: undefined,
          recurrenceId: template.id,
          skipped: false,
          subtasks: template.subtasks ? template.subtasks.map(function (s) { return Object.assign({}, s, { completed: false }); }) : undefined,
        }));
      });
    });
    return instances;
  }

  function computeDisplayTasks() {
    var weekDays = currentWeekDays();
    var virtual = generateRecurringInstances(state.tasks, weekDays);
    var real = state.tasks.filter(function (t) { return !t.skipped; });
    state.displayCache = real.concat(virtual);
    return state.displayCache;
  }

  function materializeIfNeeded(id) {
    var existing = state.tasks.find(function (t) { return t.id === id; });
    if (existing) return state.tasks;
    var virtual = state.displayCache.find(function (t) { return t.id === id; });
    if (!virtual) return state.tasks;
    var updated = state.tasks.concat([virtual]);
    saveTasks(updated);
    return updated;
  }

  /* ============================== Task actions ============================== */
  function toggleTask(id) {
    var list = materializeIfNeeded(id);
    var updated = list.map(function (t) { return t.id === id ? Object.assign({}, t, { completed: !t.completed }) : t; });
    saveTasks(updated);
    render();
  }
  function deleteTask(id) {
    var list = materializeIfNeeded(id);
    var target = list.find(function (t) { return t.id === id; });
    if (!target) { render(); return; }
    // Any occurrence that belongs to a recurring series but isn't the
    // template itself must be tombstoned (not hard-deleted), regardless of
    // whether it happens to already be materialized (e.g. because opening
    // the edit sheet materializes it first) - otherwise the recurrence
    // engine sees no record for that day and instantly regenerates it.
    var isRecurringInstance = !!target.recurrenceId && target.recurrenceId !== target.id;
    if (isRecurringInstance) {
      saveTasks(list.map(function (t) { return t.id === id ? Object.assign({}, t, { skipped: true }) : t; }));
    } else {
      saveTasks(list.filter(function (t) { return t.id !== id; }));
    }
    render();
  }
  function moveTask(id, direction) {
    // Reorders within the task's own day, only meaningful when not
    // priority-sorted and no category filter is hiding sibling tasks.
    var list = materializeIfNeeded(id);
    var task = list.find(function (t) { return t.id === id; });
    if (!task) return;
    var dayTasks = list.filter(function (t) { return t.dayKey === task.dayKey; })
      .sort(function (a, b) { return a.order - b.order || a.createdAt - b.createdAt; });
    var idx = dayTasks.findIndex(function (t) { return t.id === id; });
    var swapIdx = idx + direction;
    if (swapIdx < 0 || swapIdx >= dayTasks.length) return;
    var tmp = dayTasks[idx].order;
    dayTasks[idx] = Object.assign({}, dayTasks[idx], { order: dayTasks[swapIdx].order });
    dayTasks[swapIdx] = Object.assign({}, dayTasks[swapIdx], { order: tmp });
    var others = list.filter(function (t) { return t.dayKey !== task.dayKey; });
    var merged = others.concat(dayTasks);
    saveTasks(merged);
    render();
  }

  /* ============================== Rendering: header/toolbar ============================== */
  function renderHeader() {
    var weekDays = currentWeekDays();
    var monday = weekDays[0];
    document.getElementById("weekLabel").textContent = formatWeekLabel(monday);
    document.getElementById("todayBtn").style.display = state.weekOffset === 0 ? "none" : "flex";
    document.getElementById("sortBtn").classList.toggle("active", state.sortByPriority);
  }

  function renderFilterChips() {
    var wrap = document.getElementById("filterScroll");
    var html = '<button class="filter-chip' + (!state.filterCategory ? " active" : "") + '" data-filter="">All</button>';
    CATEGORIES.forEach(function (c) {
      html += '<button class="filter-chip' + (state.filterCategory === c.value ? " active" : "") + '" data-filter="' + c.value + '">' + c.emoji + ' ' + c.label + '</button>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll(".filter-chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var val = btn.getAttribute("data-filter");
        state.filterCategory = val ? (state.filterCategory === val ? null : val) : null;
        render();
      });
    });
  }

  /* ============================== Rendering: day list ============================== */
  function renderDayList() {
    var container = document.getElementById("dayList");
    var weekDays = currentWeekDays();
    var allTasks = computeDisplayTasks();
    var html = "";

    weekDays.forEach(function (date) {
      var dayKey = formatDayKey(date);
      var dayIndex = date.getDay() === 0 ? 6 : date.getDay() - 1;
      var isWeekend = dayIndex >= 5;
      var isToday = isSameDay(date, today) && state.weekOffset === 0;

      var dayTasksAll = allTasks.filter(function (t) { return t.dayKey === dayKey; });
      var dayTasks = state.filterCategory ? dayTasksAll.filter(function (t) { return t.category === state.filterCategory; }) : dayTasksAll;

      var sorted = dayTasks.slice();
      var incomplete = sorted.filter(function (t) { return !t.completed; });
      var complete = sorted.filter(function (t) { return t.completed; });
      if (state.sortByPriority) {
        var pw = { high: 0, standard: 1 };
        incomplete.sort(function (a, b) { return pw[a.priority] - pw[b.priority] || a.createdAt - b.createdAt; });
        complete.sort(function (a, b) { return a.createdAt - b.createdAt; });
      } else {
        incomplete.sort(function (a, b) { return a.order - b.order || a.createdAt - b.createdAt; });
        complete.sort(function (a, b) { return a.order - b.order || a.createdAt - b.createdAt; });
      }
      var ordered = incomplete.concat(complete);
      var canReorder = !state.sortByPriority && !state.filterCategory;

      html += '<section class="day-section' + (isToday ? " today" : "") + '" data-daykey="' + dayKey + '">';
      html += '<div class="day-header-row"><div class="day-header-left">';
      html += '<div class="date-circle' + (isToday ? " today" : "") + '">' + date.getDate() + '</div>';
      html += '<span class="day-label' + (isWeekend ? " weekend" : "") + (isToday ? " today" : "") + '">' + DAY_LABELS[dayIndex] + '</span>';
      if (dayTasks.length > 0) html += '<span class="task-badge">' + dayTasks.length + '</span>';
      html += '</div>';
      html += '<button class="add-btn" data-add="' + dayKey + '">+</button>';
      html += '</div>';

      if (ordered.length > 0) {
        html += '<div class="task-list">';
        var taskNumber = 0;
        ordered.forEach(function (t) {
          if (!t.completed) taskNumber++;
          html += renderTaskRow(t, t.completed ? null : taskNumber, canReorder);
        });
        html += '</div>';
      } else {
        html += '<button class="empty-row" data-add="' + dayKey + '" style="width:100%;text-align:left;"><span class="empty-text">Tap to add a task</span></button>';
      }
      html += '</section>';
    });

    container.innerHTML = html;

    container.querySelectorAll("[data-add]").forEach(function (el) {
      el.addEventListener("click", function () { openTaskModal(null, el.getAttribute("data-add")); });
    });
    container.querySelectorAll("[data-toggle]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); toggleTask(el.getAttribute("data-toggle")); });
    });
    container.querySelectorAll("[data-move-up]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); moveTask(el.getAttribute("data-move-up"), -1); });
    });
    container.querySelectorAll("[data-move-down]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); moveTask(el.getAttribute("data-move-down"), 1); });
    });
    container.querySelectorAll("[data-details-toggle]").forEach(function (el) {
      el.addEventListener("click", function () { toggleTaskDetails(el.getAttribute("data-details-toggle")); });
    });
    attachSwipeHandlers(container);

    // A full re-render (e.g. after any task mutation) rebuilds every row
    // from scratch, so if a task's details panel was open, restore it
    // instantly (no animation - this isn't a fresh user-initiated expand).
    if (state.expandedTaskId) {
      var stillVisible = document.getElementById("details-" + state.expandedTaskId);
      if (stillVisible) {
        expandDetails(state.expandedTaskId, false);
      } else {
        state.expandedTaskId = null;
      }
    }
  }

  function renderTaskRow(t, taskNumber, canReorder) {
    var catInfo = CATEGORY_MAP[t.category] || CATEGORY_MAP.other;
    var color = PRIORITY_COLORS[t.priority] || PRIORITY_COLORS.standard;
    var html = '<div class="task-row-outer">';
    html += '<div class="swipe-panel edit" data-swipe-edit="' + t.id + '">✏️</div>';
    html += '<div class="swipe-panel delete" data-swipe-delete="' + t.id + '">🗑️</div>';
    html += '<div class="task-row' + (t.completed ? " completed" : "") + '" data-swipe-id="' + t.id + '">';
    html += '<div class="priority-bar" style="background:' + color + '"></div>';
    if (taskNumber) html += '<span class="task-number">' + taskNumber + '.</span>';
    html += '<span class="task-emoji">' + catInfo.emoji + '</span>';
    if (t.recurrenceId) html += '<span class="recurrence-icon">🔁</span>';
    html += '<button class="task-title" data-details-toggle="' + t.id + '">' + escapeHtml(t.title) + '</button>';
    if (t.description) html += '<span class="desc-badge" title="Has a description">ⓘ</span>';
    if (t.subtasks && t.subtasks.length) {
      var done = t.subtasks.filter(function (s) { return s.completed; }).length;
      html += '<span class="subtask-badge">☑ ' + done + '/' + t.subtasks.length + '</span>';
    }
    if (canReorder) {
      html += '<div class="task-actions">';
      html += '<button class="mini-btn" data-move-up="' + t.id + '" aria-label="Move up">▲</button>';
      html += '<button class="mini-btn" data-move-down="' + t.id + '" aria-label="Move down">▼</button>';
      html += '</div>';
    }
    html += '<button class="check-btn" data-toggle="' + t.id + '" style="' + (t.completed ? ("border-color:" + color + ";background:" + color + "25;") : "") + '" aria-label="Mark as done">' + (t.completed ? "✓" : "") + '</button>';
    html += '</div>'; // .task-row
    html += '</div>'; // .task-row-outer
    html += '<div class="task-details" id="details-' + t.id + '" style="max-height:0; overflow:hidden;"></div>';
    return html;
  }

  /* ============================== Swipe engine (edit / delete reveal) ============================== */
  var SWIPE_W = 72;

  function attachSwipeHandlers(container) {
    container.querySelectorAll(".task-row[data-swipe-id]").forEach(function (rowEl) {
      var id = rowEl.getAttribute("data-swipe-id");
      var outer = rowEl.closest(".task-row-outer");
      var revealed = "none"; // "none" | "edit" | "delete"
      var mode = "idle"; // "idle" | "swipe"
      var startX = 0, startY = 0, baseX = 0;

      function setX(px, animate) {
        rowEl.style.transition = animate ? "transform .18s ease" : "none";
        rowEl.style.transform = "translateX(" + px + "px)";
      }
      function snap(side) {
        revealed = side;
        var target = side === "delete" ? -SWIPE_W : side === "edit" ? SWIPE_W : 0;
        setX(target, true);
      }

      rowEl.addEventListener("pointerdown", function (e) {
        if (e.target.closest(".check-btn, .mini-btn, .task-title")) return;
        mode = "idle";
        startX = e.clientX;
        startY = e.clientY;
        baseX = revealed === "delete" ? -SWIPE_W : revealed === "edit" ? SWIPE_W : 0;
        try { rowEl.setPointerCapture(e.pointerId); } catch (err) {}
      });
      rowEl.addEventListener("pointermove", function (e) {
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (mode === "idle") {
          if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) mode = "swipe";
          else return;
        }
        var next = Math.max(-SWIPE_W, Math.min(SWIPE_W, baseX + dx));
        setX(next, false);
      });
      function endSwipe(e) {
        if (mode === "swipe") {
          var dx = e.clientX - startX;
          var finalX = Math.max(-SWIPE_W, Math.min(SWIPE_W, baseX + dx));
          if (finalX <= -SWIPE_W / 2) snap("delete");
          else if (finalX >= SWIPE_W / 2) snap("edit");
          else snap("none");
        } else if (revealed !== "none") {
          snap("none");
        }
        mode = "idle";
      }
      rowEl.addEventListener("pointerup", endSwipe);
      rowEl.addEventListener("pointercancel", function () { mode = "idle"; snap("none"); });

      var editBtn = outer.querySelector("[data-swipe-edit]");
      var deleteBtn = outer.querySelector("[data-swipe-delete]");
      editBtn.addEventListener("click", function () {
        snap("none");
        openTaskModal(id);
      });
      deleteBtn.addEventListener("click", function () {
        requestDeleteConfirm(id, function () { snap("none"); });
      });
    });
  }

  /* ============================== Task details panel ============================== */

  function toggleTaskDetails(id) {
    if (state.expandedTaskId === id) {
      state.expandedTaskId = null;
      collapseDetails(id, true);
    } else {
      var prev = state.expandedTaskId;
      state.expandedTaskId = id;
      if (prev) collapseDetails(prev, true);
      expandDetails(id, true);
    }
  }

  function expandDetails(id, animate) {
    var el = document.getElementById("details-" + id);
    if (!el) return;
    el.innerHTML = renderTaskDetailsContent(id);
    wireTaskDetailsContent(id, el);
    if (animate) {
      el.style.transition = "none";
      el.style.maxHeight = "0px";
      void el.offsetHeight; // force reflow so the expand transition actually plays
      var target = el.scrollHeight;
      el.style.transition = "max-height .25s ease";
      el.style.maxHeight = target + "px";
      setTimeout(function () {
        if (state.expandedTaskId === id) el.style.maxHeight = "none";
      }, 260);
    } else {
      el.style.transition = "none";
      el.style.maxHeight = "none";
    }
  }

  function collapseDetails(id, animate) {
    var el = document.getElementById("details-" + id);
    if (!el) return;
    if (animate) {
      var current = el.scrollHeight;
      el.style.transition = "none";
      el.style.maxHeight = current + "px";
      void el.offsetHeight;
      el.style.transition = "max-height .2s ease";
      el.style.maxHeight = "0px";
    } else {
      el.style.transition = "none";
      el.style.maxHeight = "0px";
    }
  }

  function findTaskAnywhere(id) {
    return state.tasks.find(function (t) { return t.id === id; }) ||
      state.displayCache.find(function (t) { return t.id === id; });
  }

  function renderTaskDetailsContent(id) {
    var t = findTaskAnywhere(id);
    if (!t) return "";
    var html = '<div class="task-details-inner">';

    html += '<p class="td-section-label">Checklist</p>';
    if (t.subtasks && t.subtasks.length) {
      t.subtasks.forEach(function (s) {
        html += '<div class="td-subtask-outer">';
        html += '<div class="td-swipe-panel edit" data-td-sub-edit="' + s.id + '">✏️</div>';
        html += '<div class="td-swipe-panel delete" data-td-sub-delete="' + s.id + '">🗑️</div>';
        html += '<div class="td-subtask-row" data-td-sub-swipe="' + s.id + '">';
        html += '<button class="td-subtask-check' + (s.completed ? " done" : "") + '" data-td-sub-toggle="' + s.id + '">' + (s.completed ? "✓" : "") + '</button>';
        html += '<span class="td-subtask-text' + (s.completed ? " done" : "") + '" data-td-sub-label="' + s.id + '">' + escapeHtml(s.title) + '</span>';
        html += '</div></div>';
      });
    } else {
      html += '<p class="td-empty">No checklist items.</p>';
    }

    if (t.description) {
      html += '<p class="td-section-label">Description</p>';
      html += '<p class="td-description">' + escapeHtml(t.description) + '</p>';
    }

    html += '<p class="td-section-label">Move to</p>';
    html += '<div class="td-move-row">';
    html += '<div class="td-move-buttons">';
    html += '<button class="td-move-btn" data-td-move="nextday">Next day</button>';
    var todayKey = formatDayKey(today);
    if (t.dayKey > todayKey) {
      html += '<button class="td-move-btn" data-td-move="prevday">The day before</button>';
    }
    html += '<button class="td-move-btn" data-td-move="sunday">Sunday</button>';
    html += '<button class="td-move-btn" data-td-move="nextweek">Next week</button>';
    html += '<button class="td-move-btn" data-td-move="nextweekend">Next weekend</button>';
    html += '</div>';
    html += '<button class="td-move-cal-btn" data-td-move-cal="1" aria-label="Pick a date">📅</button>';
    html += '</div>';

    html += '</div>';
    return html;
  }

  function wireTaskDetailsContent(id, containerEl) {
    containerEl.querySelectorAll("[data-td-sub-toggle]").forEach(function (el) {
      el.addEventListener("click", function () {
        toggleSubtaskFromDetails(id, el.getAttribute("data-td-sub-toggle"));
      });
    });
    containerEl.querySelectorAll("[data-td-sub-edit]").forEach(function (el) {
      el.addEventListener("click", function () {
        startSubtaskInlineEdit(id, el.getAttribute("data-td-sub-edit"), containerEl);
      });
    });
    containerEl.querySelectorAll("[data-td-sub-delete]").forEach(function (el) {
      el.addEventListener("click", function () {
        var subId = el.getAttribute("data-td-sub-delete");
        var t = findTaskAnywhere(id);
        var sub = t && t.subtasks ? t.subtasks.find(function (s) { return s.id === subId; }) : null;
        showConfirm({
          title: "Delete checklist item?",
          message: sub ? sub.title : undefined,
          buttons: [
            { label: "Cancel", variant: "neutral", isCancel: true },
            { label: "Delete", variant: "danger", onPress: function () { deleteSubtaskFromDetails(id, subId); } },
          ],
        });
      });
    });
    containerEl.querySelectorAll("[data-td-sub-swipe]").forEach(function (rowEl) {
      attachTdSubtaskSwipe(rowEl);
    });
    containerEl.querySelectorAll("[data-td-move]").forEach(function (el) {
      el.addEventListener("click", function () {
        quickMoveTask(id, el.getAttribute("data-td-move"));
      });
    });
    var calBtn = containerEl.querySelector("[data-td-move-cal]");
    if (calBtn) {
      calBtn.addEventListener("click", function () {
        var t = findTaskAnywhere(id);
        var info = (t && t.recurrence) ? { recurrence: t.recurrence, startDayKey: t.dayKey, untilDayKey: t.recurrenceUntil || null } : null;
        openDayPicker("quickMove", info, id);
      });
    }
  }

  var TD_SWIPE_W = 56;

  function attachTdSubtaskSwipe(rowEl) {
    var outer = rowEl.closest(".td-subtask-outer");
    var revealed = "none";
    var mode = "idle";
    var startX = 0, startY = 0, baseX = 0;

    function setX(px, animate) {
      rowEl.style.transition = animate ? "transform .16s ease" : "none";
      rowEl.style.transform = "translateX(" + px + "px)";
    }
    function snap(side) {
      revealed = side;
      var target = side === "delete" ? -TD_SWIPE_W : side === "edit" ? TD_SWIPE_W : 0;
      setX(target, true);
    }

    rowEl.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".td-subtask-check")) return;
      mode = "idle";
      startX = e.clientX; startY = e.clientY;
      baseX = revealed === "delete" ? -TD_SWIPE_W : revealed === "edit" ? TD_SWIPE_W : 0;
      try { rowEl.setPointerCapture(e.pointerId); } catch (err) {}
    });
    rowEl.addEventListener("pointermove", function (e) {
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (mode === "idle") {
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) mode = "swipe";
        else return;
      }
      var next = Math.max(-TD_SWIPE_W, Math.min(TD_SWIPE_W, baseX + dx));
      setX(next, false);
    });
    function endSwipe(e) {
      if (mode === "swipe") {
        var dx = e.clientX - startX;
        var finalX = Math.max(-TD_SWIPE_W, Math.min(TD_SWIPE_W, baseX + dx));
        if (finalX <= -TD_SWIPE_W / 2) snap("delete");
        else if (finalX >= TD_SWIPE_W / 2) snap("edit");
        else snap("none");
      } else if (revealed !== "none") {
        snap("none");
      }
      mode = "idle";
    }
    rowEl.addEventListener("pointerup", endSwipe);
    rowEl.addEventListener("pointercancel", function () { mode = "idle"; snap("none"); });
  }

  function startSubtaskInlineEdit(taskId, subId, containerEl) {
    var rowEl = containerEl.querySelector('[data-td-sub-swipe="' + subId + '"]');
    if (!rowEl) return;
    rowEl.style.transition = "transform .16s ease";
    rowEl.style.transform = "translateX(0px)";
    var labelEl = rowEl.querySelector('[data-td-sub-label="' + subId + '"]');
    if (!labelEl) return;
    var currentText = labelEl.textContent;
    var input = document.createElement("input");
    input.type = "text";
    input.className = "td-subtask-edit-input";
    input.value = currentText;
    input.maxLength = 80;
    labelEl.replaceWith(input);
    input.focus();
    input.select();
    var committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      var newTitle = input.value.trim();
      if (newTitle && newTitle !== currentText) {
        updateSubtaskTitle(taskId, subId, newTitle);
      } else if (state.expandedTaskId === taskId) {
        expandDetails(taskId, false);
      }
    }
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { input.value = currentText; input.blur(); }
    });
  }

  function toggleSubtaskFromDetails(taskId, subId) {
    var list = materializeIfNeeded(taskId);
    var updated = list.map(function (t) {
      if (t.id !== taskId) return t;
      return Object.assign({}, t, {
        subtasks: (t.subtasks || []).map(function (s) { return s.id === subId ? Object.assign({}, s, { completed: !s.completed }) : s; }),
      });
    });
    saveTasks(updated);
    render();
  }

  function updateSubtaskTitle(taskId, subId, newTitle) {
    var list = materializeIfNeeded(taskId);
    var updated = list.map(function (t) {
      if (t.id !== taskId) return t;
      return Object.assign({}, t, {
        subtasks: (t.subtasks || []).map(function (s) { return s.id === subId ? Object.assign({}, s, { title: newTitle }) : s; }),
      });
    });
    saveTasks(updated);
    render();
  }

  function deleteSubtaskFromDetails(taskId, subId) {
    var list = materializeIfNeeded(taskId);
    var updated = list.map(function (t) {
      if (t.id !== taskId) return t;
      return Object.assign({}, t, { subtasks: (t.subtasks || []).filter(function (s) { return s.id !== subId; }) });
    });
    saveTasks(updated);
    render();
  }

  function nextWeekdayAfter(fromDate, targetDow) {
    var d = new Date(fromDate);
    d.setDate(d.getDate() + 1);
    while (d.getDay() !== targetDow) d.setDate(d.getDate() + 1);
    return d;
  }

  function quickMoveTask(taskId, action) {
    var t = findTaskAnywhere(taskId);
    if (!t) return;
    var base = dateFromDayKey(t.dayKey);
    base.setHours(0, 0, 0, 0);
    var target;
    if (action === "nextday") {
      target = new Date(base); target.setDate(target.getDate() + 1);
    } else if (action === "prevday") {
      target = new Date(base); target.setDate(target.getDate() - 1);
    } else if (action === "sunday") {
      target = nextWeekdayAfter(base, 0);
    } else if (action === "nextweek") {
      target = nextWeekdayAfter(base, 1);
    } else if (action === "nextweekend") {
      var firstSat = nextWeekdayAfter(base, 6);
      target = new Date(firstSat);
      target.setDate(target.getDate() + 7);
    } else {
      return;
    }
    moveTaskToDay(taskId, formatDayKey(target));
  }

  function moveTaskToDay(taskId, targetDayKey) {
    var list = materializeIfNeeded(taskId);
    var targetTask = list.find(function (t) { return t.id === taskId; });
    if (!targetTask) return;
    var newOrder = list
      .filter(function (t) { return t.dayKey === targetDayKey && t.id !== taskId; })
      .reduce(function (m, t) { return Math.max(m, t.order); }, -1) + 1;
    var updated = list.map(function (t) {
      return t.id === taskId ? Object.assign({}, t, { dayKey: targetDayKey, order: newOrder }) : t;
    });
    state.expandedTaskId = null;
    saveTasks(updated);
    render();
  }

  /* ============================== Confirm dialog ============================== */
  var confirmCancelFn = null;

  function showConfirm(opts) {
    confirmCancelFn = null;
    document.getElementById("confirmTitle").textContent = opts.title;
    var msgEl = document.getElementById("confirmMessage");
    if (opts.message) { msgEl.textContent = opts.message; msgEl.style.display = "block"; }
    else { msgEl.style.display = "none"; }
    var actionsEl = document.getElementById("confirmActions");
    actionsEl.innerHTML = "";
    opts.buttons.forEach(function (b) {
      if (b.isCancel) confirmCancelFn = b.onPress || null;
      var btn = document.createElement("button");
      btn.className = "confirm-btn " + (b.variant || "neutral");
      btn.textContent = b.label;
      btn.addEventListener("click", function () {
        closeConfirm();
        confirmCancelFn = null;
        if (b.onPress) b.onPress();
      });
      actionsEl.appendChild(btn);
    });
    document.getElementById("confirmModalBackdrop").classList.remove("hidden");
  }
  function closeConfirm() {
    document.getElementById("confirmModalBackdrop").classList.add("hidden");
  }
  function cancelConfirm() {
    var fn = confirmCancelFn;
    confirmCancelFn = null;
    closeConfirm();
    if (fn) fn();
  }

  function requestDeleteConfirm(id, onCancel, onDeleted) {
    var t = state.displayCache.find(function (x) { return x.id === id; });
    if (!t) return;
    if (t.recurrenceId) {
      showConfirm({
        title: "Delete recurring task",
        message: "This task repeats. Delete just this occurrence, or this and every future occurrence? Earlier ones are kept either way.",
        buttons: [
          { label: "Cancel", variant: "neutral", isCancel: true, onPress: onCancel },
          {
            label: "This task", variant: "neutral", onPress: function () {
              showConfirm({
                title: "Delete this task?",
                message: "This can't be undone.",
                buttons: [
                  { label: "Cancel", variant: "neutral", isCancel: true, onPress: onCancel },
                  { label: "Delete", variant: "danger", onPress: function () { deleteTask(id); if (onDeleted) onDeleted(); } },
                ],
              });
            }
          },
          {
            label: "This and future", variant: "danger", onPress: function () {
              showConfirm({
                title: "Delete this and future occurrences?",
                message: "Earlier occurrences are kept. This can't be undone.",
                buttons: [
                  { label: "Cancel", variant: "neutral", isCancel: true, onPress: onCancel },
                  { label: "Delete", variant: "danger", onPress: function () { deleteTaskSeriesFrom(t.recurrenceId, t.dayKey); if (onDeleted) onDeleted(); } },
                ],
              });
            }
          },
        ],
      });
    } else {
      showConfirm({
        title: "Delete task?",
        message: "This can't be undone.",
        buttons: [
          { label: "Cancel", variant: "neutral", isCancel: true, onPress: onCancel },
          { label: "Delete", variant: "danger", onPress: function () { deleteTask(id); if (onDeleted) onDeleted(); } },
        ],
      });
    }
  }

  // Deletes this occurrence and every future occurrence of the series,
  // but keeps the template and any earlier materialized instances intact.
  // Does this by capping the template's recurrenceUntil to the day before
  // fromDayKey, and removing any already-materialized instances on/after it.
  function deleteTaskSeriesFrom(recurrenceId, fromDayKey) {
    var dayBefore = formatDayKey(new Date(dateFromDayKey(fromDayKey).getTime() - 86400000));

    var updated = state.tasks.filter(function (t) {
      if (t.recurrenceId !== recurrenceId) return true;
      return t.dayKey < fromDayKey;
    });
    updated = updated.map(function (t) {
      if (t.id === recurrenceId && t.recurrence) {
        var newUntil = (t.recurrenceUntil && t.recurrenceUntil < dayBefore) ? t.recurrenceUntil : dayBefore;
        return Object.assign({}, t, { recurrenceUntil: newUntil });
      }
      return t;
    });
    saveTasks(updated);
    render();
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  /* ============================== Task modal ============================== */
  var modalState = { editingId: null, dayKey: null, priority: "standard", category: "other", recurrence: "none", recurrenceUntil: "", subtasks: [] };

  function openTaskModal(taskId, dayKeyForNew) {
    var backdrop = document.getElementById("taskModalBackdrop");
    var deleteBtn = document.getElementById("taskModalDelete");
    if (taskId) {
      materializeIfNeeded(taskId);
      var task = state.tasks.find(function (t) { return t.id === taskId; });
      if (!task) return;
      modalState = {
        editingId: taskId,
        dayKey: task.dayKey,
        priority: task.priority,
        category: task.category,
        recurrence: task.recurrence || "none",
        recurrenceUntil: task.recurrenceUntil || "",
        subtasks: task.subtasks ? task.subtasks.map(function (s) { return Object.assign({}, s); }) : [],
      };
      document.getElementById("taskModalTitle").textContent = "Edit Task";
      document.getElementById("taskTitleInput").value = task.title;
      document.getElementById("taskDescInput").value = task.description || "";
      deleteBtn.style.display = "block";
    } else {
      modalState = { editingId: null, dayKey: dayKeyForNew, priority: "standard", category: "other", recurrence: "none", recurrenceUntil: "", subtasks: [] };
      document.getElementById("taskModalTitle").textContent = "New Task";
      document.getElementById("taskTitleInput").value = "";
      document.getElementById("taskDescInput").value = "";
      deleteBtn.style.display = "none";
    }
    var dayBtn = document.getElementById("taskModalDay");
    if (taskId) {
      dayBtn.innerHTML = escapeHtml(formatDayNameLong(modalState.dayKey)) + ' <span style="opacity:.7;">▾</span>';
      dayBtn.style.cursor = "pointer";
      dayBtn.onclick = function () { openDayPicker("moveDay", computeFormRecurrenceInfo()); };
    } else {
      dayBtn.textContent = formatDayNameLong(modalState.dayKey);
      dayBtn.style.cursor = "default";
      dayBtn.onclick = null;
    }
    document.getElementById("subtaskInput").value = "";
    updateRecurrenceUntilUI();
    renderPriorityRow();
    renderCategoryGrid();
    renderRecurrenceRow();
    renderSubtaskList();
    updateSaveEnabled();
    backdrop.classList.remove("hidden");
    document.getElementById("taskTitleInput").focus();
  }
  function closeTaskModal() { document.getElementById("taskModalBackdrop").classList.add("hidden"); }

  function formatDayNameLong(dayKey) {
    var names = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var d = dateFromDayKey(dayKey);
    return names[d.getDay()] + ", " + d.getDate() + " " + MONTH_SHORT[d.getMonth()];
  }

  /* ============================== Day picker (move task to another day) ============================== */
  var dpState = { year: today.getFullYear(), month: today.getMonth() };
  var dpTarget = "moveDay"; // "moveDay" | "recurrenceUntil" | "quickMove"
  var dpViewMode = "day"; // "day" | "month"
  var dpRecurrenceInfo = null; // { recurrence, startDayKey, untilDayKey } | null
  var dpQuickMoveTaskId = null; // set when dpTarget === "quickMove"
  var dpSuppressClick = false;

  function computeFormRecurrenceInfo() {
    if (modalState.recurrence === "none") return null;
    return { recurrence: modalState.recurrence, startDayKey: modalState.dayKey, untilDayKey: modalState.recurrenceUntil || null };
  }

  // For the "Repeat Until" picker, only today (or the task's own start day,
  // whichever is later) and beyond should be reachable/selectable.
  function dpFloorDate() {
    var todayFloor = new Date(today);
    todayFloor.setHours(0, 0, 0, 0);
    if (dpTarget === "recurrenceUntil") {
      // A recurrence can't be told to end before it even starts.
      var startFloor = dateFromDayKey(modalState.dayKey);
      startFloor.setHours(0, 0, 0, 0);
      return startFloor.getTime() > todayFloor.getTime() ? startFloor : todayFloor;
    }
    if (dpTarget === "jumpToWeek") return null; // browsing past weeks in the planner is normal
    // "moveDay" and "quickMove": you can't move/schedule a task into the past.
    return todayFloor;
  }

  function dpClampToFloor() {
    var floor = dpFloorDate();
    if (!floor) return;
    if (dpState.year < floor.getFullYear() || (dpState.year === floor.getFullYear() && dpState.month < floor.getMonth())) {
      dpState.year = floor.getFullYear();
      dpState.month = floor.getMonth();
    }
  }

  function openDayPicker(target, recurrenceInfo, quickMoveTaskId, anchorDate) {
    dpTarget = target || "moveDay";
    dpRecurrenceInfo = recurrenceInfo || null;
    dpQuickMoveTaskId = quickMoveTaskId || null;
    var baseKey;
    if (dpTarget === "quickMove") {
      var qt = state.tasks.find(function (t) { return t.id === quickMoveTaskId; });
      baseKey = qt ? qt.dayKey : formatDayKey(today);
    } else if (dpTarget === "recurrenceUntil") {
      baseKey = modalState.recurrenceUntil || modalState.dayKey;
    } else if (dpTarget === "jumpToWeek") {
      baseKey = anchorDate ? formatDayKey(anchorDate) : formatDayKey(today);
    } else {
      baseKey = modalState.dayKey;
    }
    var d = dateFromDayKey(baseKey);
    dpState.year = d.getFullYear();
    dpState.month = d.getMonth();
    dpClampToFloor();
    showDpView("day");
    renderDayPickerModal();
    document.getElementById("dayPickerModalBackdrop").classList.remove("hidden");
  }
  function closeDayPicker() {
    document.getElementById("dayPickerModalBackdrop").classList.add("hidden");
  }

  function showDpView(mode) {
    dpViewMode = mode;
    document.getElementById("dpDayView").style.display = mode === "day" ? "block" : "none";
    document.getElementById("dpMonthView").style.display = mode === "month" ? "block" : "none";
  }

  function isMonthEntirelyBeforeFloor(year, monthIndex, floor) {
    if (!floor) return false;
    var lastDayOfThatMonth = new Date(year, monthIndex + 1, 0);
    lastDayOfThatMonth.setHours(0, 0, 0, 0);
    return lastDayOfThatMonth.getTime() < floor.getTime();
  }

  // Days (within the given month) that the described recurrence pattern
  // would land on - used to lightly highlight them in orange while the
  // person is picking a date, so they can see the pattern at a glance.
  function computeRecurringHighlightDays(info, year, month) {
    var result = {};
    if (!info || !info.recurrence || !info.startDayKey) return result;
    var startDate = dateFromDayKey(info.startDayKey);
    startDate.setHours(0, 0, 0, 0);
    var untilDate = info.untilDayKey ? dateFromDayKey(info.untilDayKey) : null;
    if (untilDate) untilDate.setHours(0, 0, 0, 0);
    var weeks = buildMonthGrid(year, month);
    weeks.forEach(function (week) {
      week.forEach(function (day) {
        if (!day) return;
        var d = new Date(day); d.setHours(0, 0, 0, 0);
        if (d.getTime() < startDate.getTime()) return;
        if (untilDate && d.getTime() > untilDate.getTime()) return;
        var matches = info.recurrence === "daily" ||
          (info.recurrence === "weekly" && d.getDay() === startDate.getDay()) ||
          (info.recurrence === "monthly" && isMonthlyMatch(d, startDate));
        if (matches) result[formatDayKey(d)] = true;
      });
    });
    return result;
  }

  function renderMonthGridView() {
    var floor = dpFloorDate();
    document.getElementById("dpMonthViewYearLabel").textContent = String(dpState.year);

    var prevYearBtn = document.getElementById("dpMonthViewPrevYear");
    var disablePrevYear = !!(floor && dpState.year <= floor.getFullYear());
    prevYearBtn.disabled = disablePrevYear;
    prevYearBtn.style.opacity = disablePrevYear ? "0.3" : "1";

    var grid = document.getElementById("dpMonthGrid");
    var html = "";
    for (var m = 0; m < 12; m++) {
      var disabled = isMonthEntirelyBeforeFloor(dpState.year, m, floor);
      var isThisMonth = dpState.year === today.getFullYear() && m === today.getMonth();
      html += '<button class="month-grid-cell' + (disabled ? " disabled" : "") + (isThisMonth ? " current" : "") + '"' +
        (disabled ? " disabled" : ' data-month="' + m + '"') + '>' + MONTH_SHORT[m] + '</button>';
    }
    grid.innerHTML = html;
    grid.querySelectorAll("[data-month]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        dpState.month = parseInt(btn.getAttribute("data-month"), 10);
        showDpView("day");
        renderDayPickerModal();
      });
    });
  }

  function renderDayPickerModal() {
    var monthLabelEl = document.getElementById("dpMonthLabel");
    monthLabelEl.innerHTML = escapeHtml(MONTH_NAMES[dpState.month] + " " + dpState.year) + ' <span class="month-label-chevron">▾</span>';
    var wdRow = document.getElementById("dpWeekdayRow");
    wdRow.innerHTML = DAY_LABELS.map(function (l, i) {
      return '<span class="weekday-cell' + (i >= 5 ? " weekend" : "") + '">' + l[0] + '</span>';
    }).join("");

    var floor = dpFloorDate();
    var atFloorMonth = floor && dpState.year === floor.getFullYear() && dpState.month === floor.getMonth();
    var prevMonthBtn = document.getElementById("dpPrevMonth");
    prevMonthBtn.disabled = !!atFloorMonth;
    prevMonthBtn.style.opacity = atFloorMonth ? "0.3" : "1";

    var relevantSelected = dpTarget === "recurrenceUntil" ? modalState.recurrenceUntil
      : (dpTarget === "quickMove" || dpTarget === "jumpToWeek") ? null
      : modalState.dayKey;
    var currentWeekKeys = dpTarget === "jumpToWeek" ? currentWeekDays().map(formatDayKey) : null;
    var previewDays = computeRecurringHighlightDays(dpRecurrenceInfo, dpState.year, dpState.month);
    var weeks = buildMonthGrid(dpState.year, dpState.month);
    var html = "";
    weeks.forEach(function (week) {
      var rowIsCurrentWeek = false;
      if (currentWeekKeys) {
        for (var wi = 0; wi < week.length; wi++) {
          if (week[wi] && currentWeekKeys.indexOf(formatDayKey(week[wi])) !== -1) { rowIsCurrentWeek = true; break; }
        }
      }
      html += '<div class="week-row' + (rowIsCurrentWeek ? " current-week" : "") + '">';
      week.forEach(function (day) {
        if (!day) { html += '<div class="cal-day-cell"></div>'; return; }
        var dKey = formatDayKey(day);
        var isToday = isSameDay(day, today);
        var isSelected = dKey === relevantSelected;
        var otherMonth = day.getMonth() !== dpState.month;
        var isDisabled = !!(floor && day.getTime() < floor.getTime());
        var isPreview = !!previewDays[dKey];
        html += '<div class="cal-day-cell"' + (isDisabled ? "" : ' data-pickday="' + dKey + '"') + '>' +
          '<div class="cal-day-inner' + (isToday ? " today" : "") + (isSelected ? " selected" : "") + (otherMonth ? " other-month" : "") + (isDisabled ? " disabled" : "") + (isPreview ? " preview" : "") + '">' +
          day.getDate() + '</div></div>';
      });
      html += '</div>';
    });
    var weeksEl = document.getElementById("dpWeeks");
    weeksEl.innerHTML = html;
    weeksEl.querySelectorAll("[data-pickday]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (dpSuppressClick) return;
        var picked = el.getAttribute("data-pickday");
        if (dpTarget === "recurrenceUntil") {
          modalState.recurrenceUntil = picked;
          updateRecurrenceUntilUI();
        } else if (dpTarget === "quickMove") {
          closeDayPicker();
          moveTaskToDay(dpQuickMoveTaskId, picked);
          return;
        } else if (dpTarget === "jumpToWeek") {
          var targetMonday = getWeekMonday(dateFromDayKey(picked));
          var todayMonday = getWeekMonday(new Date(today));
          state.weekOffset = Math.round((targetMonday.getTime() - todayMonday.getTime()) / (7 * 86400000));
          closeDayPicker();
          render();
          return;
        } else {
          modalState.dayKey = picked;
          var dayBtn = document.getElementById("taskModalDay");
          dayBtn.innerHTML = escapeHtml(formatDayNameLong(modalState.dayKey)) + ' <span style="opacity:.7;">▾</span>';
        }
        closeDayPicker();
      });
    });
  }

  function dpGoToMonth(delta) {
    dpState.month += delta;
    if (dpState.month < 0) { dpState.month = 11; dpState.year--; }
    else if (dpState.month > 11) { dpState.month = 0; dpState.year++; }
  }

  function animateDpMonthChange(delta) {
    if (delta < 0 && document.getElementById("dpPrevMonth").disabled) return;
    var weeksEl = document.getElementById("dpWeeks");
    var outX = delta > 0 ? "-22px" : "22px";
    var inX = delta > 0 ? "22px" : "-22px";
    weeksEl.style.transition = "transform .14s ease, opacity .14s ease";
    weeksEl.style.transform = "translateX(" + outX + ")";
    weeksEl.style.opacity = "0";
    setTimeout(function () {
      dpGoToMonth(delta);
      dpClampToFloor();
      renderDayPickerModal();
      var freshWeeksEl = document.getElementById("dpWeeks");
      freshWeeksEl.style.transition = "none";
      freshWeeksEl.style.transform = "translateX(" + inX + ")";
      freshWeeksEl.style.opacity = "0";
      void freshWeeksEl.offsetWidth; // force reflow so the next transition actually animates
      freshWeeksEl.style.transition = "transform .14s ease, opacity .14s ease";
      freshWeeksEl.style.transform = "translateX(0)";
      freshWeeksEl.style.opacity = "1";
    }, 140);
  }

  function attachDpSwipe(weeksEl) {
    var startX = 0, startY = 0, tracking = false, moved = false;
    weeksEl.addEventListener("pointerdown", function (e) {
      startX = e.clientX; startY = e.clientY; tracking = true; moved = false;
    });
    weeksEl.addEventListener("pointermove", function (e) {
      if (!tracking) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!moved && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) moved = true;
    });
    function endSwipe(e) {
      if (!tracking) return;
      tracking = false;
      if (!moved) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) < 40) return;
      dpSuppressClick = true;
      setTimeout(function () { dpSuppressClick = false; }, 300);
      animateDpMonthChange(dx < 0 ? 1 : -1);
    }
    weeksEl.addEventListener("pointerup", endSwipe);
    weeksEl.addEventListener("pointercancel", function () { tracking = false; });
  }

  function renderPriorityRow() {
    document.querySelectorAll("#priorityRow .option-pill").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-priority") === modalState.priority);
    });
  }
  function renderRecurrenceRow() {
    document.querySelectorAll("#recurrenceRow .option-pill").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-recurrence") === modalState.recurrence);
    });
    updateRecurrenceUntilUI();
  }
  function updateRecurrenceUntilUI() {
    var wrap = document.getElementById("recurrenceUntilWrap");
    wrap.style.display = modalState.recurrence === "none" ? "none" : "block";
    var label = document.getElementById("recurrenceUntilLabel");
    var clearBtn = document.getElementById("recurrenceUntilClear");
    if (modalState.recurrenceUntil) {
      label.textContent = formatDayNameLong(modalState.recurrenceUntil);
      clearBtn.style.display = "flex";
    } else {
      label.textContent = "No end date";
      clearBtn.style.display = "none";
    }
  }
  function renderCategoryGrid() {
    var grid = document.getElementById("categoryGrid");
    grid.innerHTML = CATEGORIES.map(function (c) {
      return '<button class="category-option' + (modalState.category === c.value ? " active" : "") + '" data-category="' + c.value + '"><span class="em">' + c.emoji + '</span>' + c.label + '</button>';
    }).join("");
    grid.querySelectorAll(".category-option").forEach(function (btn) {
      btn.addEventListener("click", function () {
        modalState.category = btn.getAttribute("data-category");
        renderCategoryGrid();
      });
    });
  }
  function renderSubtaskList() {
    var wrap = document.getElementById("subtaskList");
    wrap.innerHTML = modalState.subtasks.map(function (s) {
      return '<div class="subtask-row">' +
        '<button class="subtask-check' + (s.completed ? " done" : "") + '" data-subtoggle="' + s.id + '">' + (s.completed ? "✓" : "") + '</button>' +
        '<span class="subtask-text' + (s.completed ? " done" : "") + '">' + escapeHtml(s.title) + '</span>' +
        '<button class="subtask-remove" data-subremove="' + s.id + '">✕</button>' +
        '</div>';
    }).join("");
    wrap.querySelectorAll("[data-subtoggle]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-subtoggle");
        modalState.subtasks = modalState.subtasks.map(function (s) { return s.id === id ? Object.assign({}, s, { completed: !s.completed }) : s; });
        renderSubtaskList();
      });
    });
    wrap.querySelectorAll("[data-subremove]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-subremove");
        var item = modalState.subtasks.find(function (s) { return s.id === id; });
        showConfirm({
          title: "Delete checklist item?",
          message: item ? item.title : undefined,
          buttons: [
            { label: "Cancel", variant: "neutral", isCancel: true },
            {
              label: "Delete", variant: "danger", onPress: function () {
                modalState.subtasks = modalState.subtasks.filter(function (s) { return s.id !== id; });
                renderSubtaskList();
              }
            },
          ],
        });
      });
    });
  }
  function addSubtaskFromInput() {
    var input = document.getElementById("subtaskInput");
    var title = input.value.trim();
    if (!title) return;
    modalState.subtasks.push({ id: uid(), title: title, completed: false });
    input.value = "";
    renderSubtaskList();
  }
  function updateSaveEnabled() {
    var titleOk = document.getElementById("taskTitleInput").value.trim().length > 0;
    document.getElementById("taskModalSave").disabled = !titleOk;
  }

  function saveTaskModal() {
    var title = document.getElementById("taskTitleInput").value.trim();
    if (!title) return;
    var description = document.getElementById("taskDescInput").value.trim() || undefined;

    if (modalState.editingId) {
      var originalTask = state.tasks.find(function (t) { return t.id === modalState.editingId; });
      var dayChanged = originalTask && modalState.dayKey !== originalTask.dayKey;
      var newOrder = originalTask ? originalTask.order : 0;
      if (dayChanged) {
        newOrder = state.tasks
          .filter(function (t) { return t.dayKey === modalState.dayKey && t.id !== modalState.editingId; })
          .reduce(function (m, t) { return Math.max(m, t.order); }, -1) + 1;
      }
      var updated = state.tasks.map(function (t) {
        if (t.id !== modalState.editingId) return t;
        var recurrence = modalState.recurrence === "none" ? undefined : modalState.recurrence;
        return Object.assign({}, t, {
          title: title,
          dayKey: modalState.dayKey,
          order: newOrder,
          priority: modalState.priority,
          category: modalState.category,
          subtasks: modalState.subtasks.length ? modalState.subtasks : undefined,
          recurrence: recurrence,
          recurrenceId: recurrence ? (t.recurrenceId || t.id) : t.recurrenceId,
          recurrenceUntil: recurrence ? (modalState.recurrenceUntil || undefined) : undefined,
          description: description,
        });
      });
      saveTasks(updated);
    } else {
      var dayTasksCount = state.tasks.filter(function (t) { return t.dayKey === modalState.dayKey; })
        .reduce(function (m, t) { return Math.max(m, t.order); }, -1);
      var id = uid();
      var recurrence = modalState.recurrence === "none" ? undefined : modalState.recurrence;
      var newTask = {
        id: id,
        title: title,
        dayKey: modalState.dayKey,
        completed: false,
        priority: modalState.priority,
        category: modalState.category,
        createdAt: Date.now(),
        order: dayTasksCount + 1,
        subtasks: modalState.subtasks.length ? modalState.subtasks : undefined,
        recurrence: recurrence,
        recurrenceId: recurrence ? id : undefined,
        recurrenceUntil: recurrence ? (modalState.recurrenceUntil || undefined) : undefined,
        description: description,
      };
      saveTasks(state.tasks.concat([newTask]));
    }
    closeTaskModal();
    render();
  }

  function deleteTaskFromModal() {
    if (!modalState.editingId) return;
    requestDeleteConfirm(modalState.editingId, null, function () {
      closeTaskModal();
    });
  }

  /* ============================== Month calendar modal ============================== */
  function buildMonthGrid(year, month) {
    var firstDay = new Date(year, month, 1);
    var lastDay = new Date(year, month + 1, 0);
    var startDow = firstDay.getDay();
    var offset = startDow === 0 ? 6 : startDow - 1;
    var days = [];
    for (var i = 0; i < offset; i++) days.push(null);
    for (var d = 1; d <= lastDay.getDate(); d++) days.push(new Date(year, month, d));
    while (days.length % 7 !== 0) days.push(null);
    var weeks = [];
    for (var j = 0; j < days.length; j += 7) weeks.push(days.slice(j, j + 7));
    // Always return exactly 6 week-rows so calendar modals never change
    // height when switching between 4/5/6-row months.
    while (weeks.length < 6) weeks.push([null, null, null, null, null, null, null]);
    return weeks;
  }

  // Opens the shared day-picker in "jump to week" mode: picking any day
  // (past or future - no floor restriction here) navigates the planner to
  // the week containing it.
  function openJumpToWeekPicker() {
    openDayPicker("jumpToWeek", null, null, currentWeekDays()[0]);
  }

  /* ============================== Stats modal ============================== */
  function openStatsModal() {
    var weekDays = currentWeekDays();
    var keys = weekDays.map(formatDayKey);
    var allTasks = computeDisplayTasks();
    var weekTasks = allTasks.filter(function (t) { return keys.indexOf(t.dayKey) !== -1; });

    document.getElementById("statsWeekLabel").textContent = formatWeekLabel(weekDays[0]);
    var content = document.getElementById("statsContent");

    if (weekTasks.length === 0) {
      content.innerHTML = '<p class="stats-empty">No tasks this week yet.</p>';
    } else {
      var total = weekTasks.length;
      var completed = weekTasks.filter(function (t) { return t.completed; }).length;
      var pct = Math.round((completed / total) * 100);
      var high = weekTasks.filter(function (t) { return t.priority === "high"; }).length;
      var highDone = weekTasks.filter(function (t) { return t.priority === "high" && t.completed; }).length;

      var byCat = {};
      weekTasks.forEach(function (t) {
        if (!byCat[t.category]) byCat[t.category] = { total: 0, done: 0 };
        byCat[t.category].total++;
        if (t.completed) byCat[t.category].done++;
      });
      var catRows = Object.keys(byCat).sort(function (a, b) { return byCat[b].total - byCat[a].total; });

      var html = '<div class="stats-progress-row"><span class="stats-big">' + pct + '%</span>' +
        '<span class="stats-label">' + completed + ' of ' + total + ' tasks completed</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
      if (high > 0) html += '<div class="stats-meta">High priority: ' + highDone + '/' + high + ' done</div>';
      html += '<p class="section-label">By category</p>';
      catRows.forEach(function (cat) {
        var info = CATEGORY_MAP[cat] || CATEGORY_MAP.other;
        var e = byCat[cat];
        var p = Math.round((e.done / e.total) * 100);
        html += '<div class="cat-stat-row"><span class="cat-stat-emoji">' + info.emoji + '</span>' +
          '<span class="cat-stat-label">' + info.label + '</span>' +
          '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + p + '%"></div></div>' +
          '<span class="cat-stat-count">' + e.done + '/' + e.total + '</span></div>';
      });
      content.innerHTML = html;
    }
    document.getElementById("statsModalBackdrop").classList.remove("hidden");
  }
  function closeStatsModal() { document.getElementById("statsModalBackdrop").classList.add("hidden"); }

  /* ============================== Share ============================== */
  function shareWeek() {
    var weekDays = currentWeekDays();
    var allTasks = computeDisplayTasks();
    var lines = ["Planner — " + formatWeekLabel(weekDays[0]), ""];
    weekDays.forEach(function (date) {
      var dKey = formatDayKey(date);
      var dayIndex = date.getDay() === 0 ? 6 : date.getDay() - 1;
      var dayTasks = allTasks.filter(function (t) {
        return t.dayKey === dKey && (!state.filterCategory || t.category === state.filterCategory);
      }).sort(function (a, b) { return a.order - b.order || a.createdAt - b.createdAt; });
      lines.push(DAY_LABELS[dayIndex] + " " + date.getDate());
      if (dayTasks.length === 0) {
        lines.push("  (no tasks)");
      } else {
        dayTasks.forEach(function (t) { lines.push("  " + (t.completed ? "[x]" : "[ ]") + " " + t.title); });
      }
      lines.push("");
    });
    var text = lines.join("\n");

    if (navigator.share) {
      navigator.share({ title: "Weekly Planner", text: text }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("Week summary copied to clipboard");
      }).catch(function () { showToast("Could not copy"); });
    } else {
      window.prompt("Skopiuj podsumowanie tygodnia:", text);
    }
  }

  function showToast(msg) {
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  /* ============================== Master render ============================== */
  function render() {
    renderHeader();
    renderFilterChips();
    renderDayList();
  }

  /* ============================== Wire up static controls ============================== */
  function init() {
    loadData();
    document.getElementById("notesInput").value = state.notes;

    document.getElementById("openCalendarBtn").addEventListener("click", openJumpToWeekPicker);
    document.getElementById("headerCenterBtn").addEventListener("click", openJumpToWeekPicker);
    document.getElementById("statsBtn").addEventListener("click", openStatsModal);
    document.getElementById("shareBtn").addEventListener("click", shareWeek);
    document.getElementById("sortBtn").addEventListener("click", function () {
      state.sortByPriority = !state.sortByPriority;
      render();
    });
    document.getElementById("todayBtn").addEventListener("click", function () {
      state.weekOffset = 0;
      render();
    });
    document.getElementById("prevWeekBtn").addEventListener("click", function () { state.weekOffset--; render(); });
    document.getElementById("nextWeekBtn").addEventListener("click", function () { state.weekOffset++; render(); });

    var notesTimer = null;
    document.getElementById("notesInput").addEventListener("input", function (e) {
      var val = e.target.value;
      if (notesTimer) clearTimeout(notesTimer);
      notesTimer = setTimeout(function () { saveNotes(val); }, 500);
    });

    // Task modal wiring
    document.getElementById("taskTitleInput").addEventListener("input", updateSaveEnabled);
    document.getElementById("taskModalCancel").addEventListener("click", closeTaskModal);
    document.getElementById("taskModalSave").addEventListener("click", saveTaskModal);
    document.getElementById("taskModalDelete").addEventListener("click", deleteTaskFromModal);
    document.getElementById("taskModalBackdrop").addEventListener("click", function (e) {
      if (e.target === this) closeTaskModal();
    });
    document.querySelectorAll("#priorityRow .option-pill").forEach(function (btn) {
      btn.addEventListener("click", function () { modalState.priority = btn.getAttribute("data-priority"); renderPriorityRow(); });
    });
    document.querySelectorAll("#recurrenceRow .option-pill").forEach(function (btn) {
      btn.addEventListener("click", function () { modalState.recurrence = btn.getAttribute("data-recurrence"); renderRecurrenceRow(); });
    });
    document.getElementById("recurrenceUntilBtn").addEventListener("click", function () { openDayPicker("recurrenceUntil", computeFormRecurrenceInfo()); });
    document.getElementById("recurrenceUntilClear").addEventListener("click", function () {
      modalState.recurrenceUntil = "";
      updateRecurrenceUntilUI();
    });
    document.getElementById("subtaskAddBtn").addEventListener("click", addSubtaskFromInput);
    document.getElementById("subtaskInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); addSubtaskFromInput(); }
    });

    // Day picker modal wiring (move-task-to-day, inside the task edit sheet)
    document.getElementById("dpPrevMonth").addEventListener("click", function () {
      dpState.month--; if (dpState.month < 0) { dpState.month = 11; dpState.year--; }
      dpClampToFloor();
      renderDayPickerModal();
    });
    document.getElementById("dpNextMonth").addEventListener("click", function () {
      dpState.month++; if (dpState.month > 11) { dpState.month = 0; dpState.year++; }
      renderDayPickerModal();
    });
    attachDpSwipe(document.getElementById("dpWeeks"));
    document.getElementById("dpMonthLabel").addEventListener("click", function () {
      showDpView("month");
      renderMonthGridView();
    });
    document.getElementById("dpMonthViewPrevYear").addEventListener("click", function () {
      dpState.year--;
      renderMonthGridView();
    });
    document.getElementById("dpMonthViewNextYear").addEventListener("click", function () {
      dpState.year++;
      renderMonthGridView();
    });
    document.getElementById("dayPickerModalClose").addEventListener("click", closeDayPicker);
    document.getElementById("dayPickerModalBackdrop").addEventListener("click", function (e) { if (e.target === this) closeDayPicker(); });

    // Stats modal wiring
    document.getElementById("statsModalClose").addEventListener("click", closeStatsModal);
    document.getElementById("statsModalBackdrop").addEventListener("click", function (e) { if (e.target === this) closeStatsModal(); });

    document.getElementById("confirmModalBackdrop").addEventListener("click", function (e) { if (e.target === this) cancelConfirm(); });

    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      closeTaskModal(); closeDayPicker(); closeStatsModal(); cancelConfirm();
    });

    render();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
